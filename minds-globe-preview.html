<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minds Globe — Atlas de Relações Internacionais</title>
<meta name="description" content="Minds Globe: repositório pessoal de estudos de Relações Internacionais, organizado por semestre.">
<meta name="theme-color" content="#0a1f26">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   MINDS GLOBE — DESIGN SYSTEM
   Paleta: azul petróleo + dourado · tema escuro · editorial, não "tech"
   ========================================================================= */

:root {
  /* --- Cor --- */
  --bg-void:        #061418;
  --bg-primary:     #0a1f26;
  --bg-secondary:   #0e2a32;
  --bg-elevated:    #123641;
  --bg-elevated-hi: #17414d;

  --gold:           #cda44d;
  --gold-bright:    #e8c878;
  --gold-deep:      #8a6a2e;
  --gold-line:      rgba(205, 164, 77, 0.28);
  --gold-line-soft: rgba(205, 164, 77, 0.14);

  --ink-100:        #f4efe2;
  --ink-70:         #c9d4d3;
  --ink-50:         #93a6a7;
  --ink-30:         #5d7275;

  --shadow-deep:    0 30px 60px -25px rgba(0, 0, 0, 0.65);
  --shadow-soft:    0 10px 30px -12px rgba(0, 0, 0, 0.5);

  /* --- Tipografia --- */
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-body: "Work Sans", "Segoe UI", sans-serif;

  /* --- Layout --- */
  --max-width: 1220px;
  --gutter: clamp(1.25rem, 4vw, 3rem);
  --radius-sm: 6px;
  --radius-md: 14px;
  --radius-lg: 22px;

  /* --- Movimento --- */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-soft: cubic-bezier(0.4, 0, 0.2, 1);
  --dur-fast: 200ms;
  --dur-med: 420ms;
  --dur-slow: 900ms;
}

@media (prefers-reduced-motion: reduce) {
  :root { --dur-fast: 0ms; --dur-med: 0ms; --dur-slow: 0ms; }
}

/* ---------------------------------------------------------------------- */
/* Reset                                                                   */
/* ---------------------------------------------------------------------- */

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

body {
  margin: 0;
  background: var(--bg-void);
  color: var(--ink-100);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(205, 164, 77, 0.08), transparent 60%),
    radial-gradient(ellipse 800px 600px at 100% 10%, rgba(20, 80, 90, 0.35), transparent 55%),
    linear-gradient(180deg, var(--bg-void) 0%, var(--bg-primary) 100%);
}

h1, h2, h3, h4 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.12;
  margin: 0;
  color: var(--ink-100);
  letter-spacing: -0.01em;
}

p { margin: 0; }

a { color: inherit; text-decoration: none; }

ul { list-style: none; margin: 0; padding: 0; }

button { font-family: inherit; cursor: pointer; }

img, svg { display: block; max-width: 100%; }

::selection { background: var(--gold-deep); color: var(--ink-100); }

:focus-visible {
  outline: 2px solid var(--gold-bright);
  outline-offset: 3px;
  border-radius: 4px;
}

/* Títulos são focados via script (JS) a cada troca de página, para leitores de
   tela — nunca por navegação de teclado. Por isso não mostramos o anel dourado
   aqui, senão ele "pisca" sozinho a cada troca de página. */
h1[tabindex="-1"]:focus {
  outline: none;
}

.skip-link {
  position: fixed;
  top: -60px;
  left: 1rem;
  z-index: 999;
  background: var(--gold);
  color: var(--bg-void);
  padding: 0.7rem 1.2rem;
  border-radius: var(--radius-sm);
  font-weight: 600;
  transition: top var(--dur-fast) var(--ease-out);
}
.skip-link:focus { top: 1rem; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
}
.eyebrow::before {
  content: "";
  width: 22px;
  height: 1px;
  background: var(--gold);
  display: inline-block;
}

.wrap {
  max-width: var(--max-width);
  margin: 0 auto;
  padding-left: var(--gutter);
  padding-right: var(--gutter);
  position: relative;
  z-index: 1;
}

/* ---------------------------------------------------------------------- */
/* Header                                                                  */
/* ---------------------------------------------------------------------- */

.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(6, 20, 24, 0.72);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--gold-line-soft);
}

.site-header .wrap {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 1.05rem;
  padding-bottom: 1.05rem;
  gap: 0.75rem;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.65rem;
  font-family: var(--font-display);
  font-size: 1.28rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  color: var(--ink-100);
  min-width: 0;
}

.brand-mark {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
}

.brand-mark circle,
.brand-mark ellipse,
.brand-mark path {
  stroke: var(--gold);
  fill: none;
}

.brand small {
  display: block;
  font-family: var(--font-body);
  font-size: 0.62rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-50);
  font-weight: 500;
  margin-top: 0.1rem;
}

.main-nav {
  display: flex;
  align-items: center;
  gap: 2.4rem;
}

.main-nav ul {
  display: flex;
  gap: 2.2rem;
}

.main-nav a {
  font-size: 0.92rem;
  font-weight: 500;
  color: var(--ink-70);
  position: relative;
  padding: 0.3rem 0;
  transition: color var(--dur-fast) var(--ease-soft);
}

.main-nav a::after {
  content: "";
  position: absolute;
  left: 0; right: 100%;
  bottom: -2px;
  height: 1px;
  background: var(--gold);
  transition: right var(--dur-med) var(--ease-out);
}

.main-nav a:hover,
.main-nav a:focus-visible {
  color: var(--ink-100);
}
.main-nav a:hover::after,
.main-nav a:focus-visible::after { right: 0; }

.hamburger {
  display: none;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  background: transparent;
  border: 1px solid var(--gold-line);
  border-radius: 8px;
}

.hamburger span {
  display: block;
  width: 18px;
  height: 1.5px;
  margin: 0 auto;
  background: var(--gold-bright);
  transition: transform var(--dur-fast) var(--ease-soft), opacity var(--dur-fast) var(--ease-soft);
}

.hamburger[aria-expanded="true"] span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); }
.hamburger[aria-expanded="true"] span:nth-child(2) { opacity: 0; }
.hamburger[aria-expanded="true"] span:nth-child(3) { transform: translateY(-6.5px) rotate(-45deg); }

.mobile-nav {
  position: fixed;
  inset: 0 0 auto 0;
  top: 0;
  transform: translateY(-100%);
  transition: transform var(--dur-med) var(--ease-out);
  background: var(--bg-primary);
  border-bottom: 1px solid var(--gold-line);
  z-index: 99;
  padding: 6.5rem 2rem 3rem;
  box-shadow: var(--shadow-deep);
}

.mobile-nav.is-open { transform: translateY(0); }

.mobile-nav ul { display: flex; flex-direction: column; gap: 1.6rem; }

.mobile-nav a {
  font-family: var(--font-display);
  font-size: 1.7rem;
  font-weight: 500;
  color: var(--ink-100);
}
.mobile-nav a:hover, .mobile-nav a:focus-visible { color: var(--gold-bright); }

body.menu-open { overflow: hidden; }

/* ---------------------------------------------------------------------- */
/* Botões / navegação secundária                                          */
/* ---------------------------------------------------------------------- */

.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--gold);
  padding: 0.65rem 1.1rem 0.65rem 0.8rem;
  border: 1px solid var(--gold-line);
  border-radius: 999px;
  background: rgba(205, 164, 77, 0.05);
  transition: background var(--dur-fast) var(--ease-soft), border-color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
}

.btn-back svg { width: 16px; height: 16px; transition: transform var(--dur-fast) var(--ease-soft); }

.btn-back:hover, .btn-back:focus-visible {
  background: rgba(205, 164, 77, 0.14);
  border-color: var(--gold);
  transform: translateX(-2px);
}
.btn-back:hover svg { transform: translateX(-3px); }

/* ---------------------------------------------------------------------- */
/* Hero                                                                    */
/* ---------------------------------------------------------------------- */

.hero {
  position: relative;
  padding: clamp(3rem, 8vw, 6rem) 0 clamp(3.5rem, 9vw, 7rem);
  overflow: hidden;
}

.hero .wrap {
  display: grid;
  grid-template-columns: minmax(0, 1.05fr) minmax(0, 0.95fr);
  align-items: center;
  gap: clamp(1.75rem, 4vw, 3.2rem);
}

.hero-copy {
  min-width: 0;
}

.hero-copy h1 {
  font-size: clamp(2.6rem, 5.4vw, 4.4rem);
  margin-top: 1rem;
}

.hero-copy h1 em {
  font-style: normal;
  color: var(--gold-bright);
}

.hero-copy p {
  margin-top: 1.4rem;
  max-width: 46ch;
  color: var(--ink-70);
  font-size: 1.08rem;
}

.hero-actions {
  display: flex;
  gap: 1rem;
  margin-top: 2.4rem;
  flex-wrap: wrap;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: linear-gradient(135deg, var(--gold-bright), var(--gold) 70%);
  color: var(--bg-void);
  font-weight: 700;
  font-size: 0.94rem;
  padding: 0.95rem 1.7rem;
  border-radius: 999px;
  border: none;
  box-shadow: 0 12px 26px -10px rgba(205, 164, 77, 0.45);
  transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.btn-primary svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}
.btn-primary:hover, .btn-primary:focus-visible {
  transform: translateY(-2px);
  box-shadow: 0 16px 32px -10px rgba(205, 164, 77, 0.6);
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  color: var(--ink-100);
  font-weight: 600;
  font-size: 0.94rem;
  padding: 0.95rem 1.5rem;
  border-radius: 999px;
  border: 1px solid var(--gold-line);
  background: rgba(205, 164, 77, 0.07);
  transition: color var(--dur-fast) var(--ease-soft), border-color var(--dur-fast) var(--ease-soft), background var(--dur-fast) var(--ease-soft), opacity var(--dur-fast) var(--ease-soft);
}
.btn-ghost svg {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
}
.btn-ghost:hover, .btn-ghost:focus-visible {
  color: var(--gold-bright);
  border-color: var(--gold);
  background: rgba(205, 164, 77, 0.16);
}
.btn-ghost:disabled {
  opacity: 0.38;
  cursor: not-allowed;
}
.btn-ghost:disabled:hover {
  color: var(--ink-100);
  border-color: var(--gold-line);
  background: rgba(205, 164, 77, 0.07);
}

.hero-stats {
  display: flex;
  gap: clamp(1.6rem, 4vw, 2.6rem);
  margin-top: 3rem;
  padding-top: 2rem;
  border-top: 1px solid var(--gold-line-soft);
}

.hero-stats .stat-value {
  font-family: var(--font-display);
  font-size: 2.1rem;
  color: var(--gold-bright);
  display: block;
}
.hero-stats .stat-label {
  font-size: 0.78rem;
  color: var(--ink-50);
  letter-spacing: 0.04em;
}

/* --- Globo animado (elemento assinatura) --- */

.globe-stage {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
}

.globe-halo {
  position: absolute;
  width: 78%;
  aspect-ratio: 1;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(205, 164, 77, 0.16), transparent 70%);
  filter: blur(6px);
}

.globe-svg {
  width: min(100%, 460px);
  height: auto;
  animation: globe-spin 90s linear infinite;
  transform-origin: 50% 50%;
}

@keyframes globe-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.globe-svg .rim { stroke: var(--gold-line); }
.globe-svg .meridian { stroke: var(--gold-line-soft); }
.globe-svg .tick { stroke: var(--gold-line); }
.globe-svg .route {
  stroke: var(--gold);
  stroke-opacity: 0.55;
  stroke-dasharray: 4 7;
  animation: route-flow 6s linear infinite;
}
@keyframes route-flow { to { stroke-dashoffset: -110; } }

.globe-svg .node {
  fill: var(--gold-bright);
  animation: node-pulse 3.2s ease-in-out infinite;
}
.globe-svg .node:nth-child(2) { animation-delay: 0.4s; }
.globe-svg .node:nth-child(3) { animation-delay: 0.9s; }
.globe-svg .node:nth-child(4) { animation-delay: 1.3s; }
.globe-svg .node:nth-child(5) { animation-delay: 1.8s; }
.globe-svg .node:nth-child(6) { animation-delay: 2.2s; }

@keyframes node-pulse {
  0%, 100% { opacity: 0.55; r: 3; }
  50% { opacity: 1; r: 4.4; }
}

@media (prefers-reduced-motion: reduce) {
  .globe-svg { animation: none; }
  .globe-svg .route { animation: none; }
  .globe-svg .node { animation: none; opacity: 0.85; }
}

/* ---------------------------------------------------------------------- */
/* Seção de semestres — "estante"                                        */
/* ---------------------------------------------------------------------- */

.section {
  padding: clamp(2.5rem, 6vw, 4.5rem) 0;
}

.section-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 1.5rem;
  flex-wrap: wrap;
  margin-bottom: clamp(2rem, 5vw, 3rem);
}

.section-head h2 {
  font-size: clamp(1.9rem, 3.6vw, 2.6rem);
  margin-top: 0.6rem;
}

.section-head p {
  color: var(--ink-50);
  max-width: 42ch;
}

.shelf {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: clamp(1.4rem, 2.6vw, 2.2rem);
  perspective: 1400px;
}

/* --- Capa de livro (semestre) --- */

.book {
  position: relative;
  display: block;
  border: none;
  background: none;
  padding: 0;
  text-align: left;
  width: 100%;
}

.book-cover {
  position: relative;
  aspect-ratio: 3 / 4.2;
  border-radius: 4px 10px 10px 4px;
  background:
    linear-gradient(155deg, var(--bg-elevated-hi) 0%, var(--bg-secondary) 55%, var(--bg-primary) 100%);
  border: 1px solid var(--gold-line);
  box-shadow: var(--shadow-soft), inset 0 0 0 1px rgba(255,255,255,0.02);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.9rem;
  padding: 1.5rem 1rem;
  transform: rotateY(0deg) translateZ(0);
  transition: transform var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out), border-color var(--dur-med) var(--ease-soft);
  will-change: transform;
}

/* lombada */
.book-cover::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 14px;
  background: linear-gradient(90deg, rgba(0,0,0,0.5), transparent);
}

/* moldura dourada */
.book-cover::after {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid var(--gold-line);
  border-radius: 2px 8px 8px 2px;
  pointer-events: none;
}

.book-ordinal {
  font-family: var(--font-display);
  font-size: clamp(2.6rem, 5vw, 3.4rem);
  color: var(--gold-bright);
  line-height: 1;
  text-shadow: 0 2px 18px rgba(205, 164, 77, 0.25);
}

.book-label {
  font-size: 0.72rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-50);
}

.book-glyph {
  width: 30px;
  height: 30px;
  margin-top: 0.2rem;
  opacity: 0.8;
}
.book-glyph circle, .book-glyph path { stroke: var(--gold-line); fill: none; }

.book-count {
  position: absolute;
  bottom: 1.1rem;
  left: 0; right: 0;
  text-align: center;
  font-size: 0.74rem;
  color: var(--ink-50);
  letter-spacing: 0.04em;
}
.book-count strong { color: var(--gold); font-weight: 600; }

.book:hover .book-cover,
.book:focus-visible .book-cover {
  transform: rotateY(-8deg) translateY(-6px);
  box-shadow: var(--shadow-deep);
  border-color: var(--gold);
}

.book:active .book-cover { transform: rotateY(-4deg) translateY(-2px) scale(0.99); }

/* ---------------------------------------------------------------------- */
/* Página de semestre — sumário de matérias                              */
/* ---------------------------------------------------------------------- */

.page-head {
  padding: clamp(2.2rem, 6vw, 3.5rem) 0 1.5rem;
}

.page-head .btn-back { margin-bottom: 1.8rem; }

.page-head h1 {
  font-size: clamp(2.2rem, 5vw, 3.2rem);
  margin-top: 0.7rem;
}

.page-head .meta {
  color: var(--ink-50);
  margin-top: 0.7rem;
  font-size: 0.95rem;
}

.subject-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.1rem;
  padding-bottom: clamp(3rem, 7vw, 5rem);
}

.subject-card {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 1.35rem 1.4rem;
  background: var(--bg-secondary);
  border: 1px solid var(--gold-line-soft);
  border-radius: var(--radius-md);
  transition: border-color var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-soft);
}

.subject-index {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--gold);
  flex-shrink: 0;
  width: 2.2rem;
}

.subject-card h3 {
  font-family: var(--font-body);
  font-size: 0.98rem;
  font-weight: 600;
  color: var(--ink-100);
  line-height: 1.35;
  min-width: 0;
  overflow-wrap: break-word;
}

.subject-arrow {
  margin-left: auto;
  width: 18px; height: 18px;
  flex-shrink: 0;
  color: var(--gold);
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity var(--dur-fast) var(--ease-soft), transform var(--dur-fast) var(--ease-soft);
}

.subject-card:hover,
.subject-card:focus-visible {
  border-color: var(--gold);
  background: var(--bg-elevated);
  transform: translateX(3px);
}
.subject-card:hover .subject-arrow,
.subject-card:focus-visible .subject-arrow {
  opacity: 1;
  transform: translateX(0);
}

/* ---------------------------------------------------------------------- */
/* Página de matéria                                                      */
/* ---------------------------------------------------------------------- */

.subject-page { padding-bottom: clamp(3rem, 7vw, 5rem); }

.subject-header {
  padding: clamp(2.2rem, 6vw, 3.5rem) 0 clamp(1.8rem, 4vw, 2.5rem);
  border-bottom: 1px solid var(--gold-line-soft);
  margin-bottom: clamp(2rem, 5vw, 3rem);
}

.subject-header .btn-back { margin-bottom: 1.8rem; }

.subject-header h1 {
  font-size: clamp(1.9rem, 4.4vw, 2.8rem);
  margin-top: 0.6rem;
  max-width: 22ch;
}

.subject-breadcrumb {
  font-size: 0.82rem;
  color: var(--ink-50);
  margin-top: 0.9rem;
}
.subject-breadcrumb strong { color: var(--gold); font-weight: 600; }

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: clamp(1.5rem, 3vw, 2.5rem);
}

.content-block {
  background: var(--bg-secondary);

function montarGeografiaNegocios() {
  const m = novaMateria("1-geografia-negocios", "Geografia dos Negócios Internacionais");

  m.resumo = `Como a globalização transformou a geografia da produção e do comércio mundial: as ferramentas de análise de Peter Dicken (macroestrutura, redes e circuitos, distribuição desigual dos fatores), a visão de Lasserre sobre a empresa global e o caso OTIS, o papel das ETNs e do Estado (com o caso da China em profundidade) e os níveis de integração econômica regional, do Mercosul à União Europeia.`;

  m.topicos = [
    novoTopico(
      "gni-parte1-globalizacao",
      "Parte 1 — O que é globalização e por que ninguém concorda sobre ela",
      `A disciplina abre com uma pergunta simples: **o mundo está realmente globalizado, ou estamos vivendo um ciclo como tantos outros?** A resposta, seguindo Dicken, é dupla: globalização é real, mas não é linear, não é igual em todos os lugares e é fortemente questionada por interpretações rivais.

**A definição de Dicken (a que vale para a prova):** globalização é "a transformação **qualitativa** das relações econômicas através do espaço geográfico" — o desenvolvimento de **redes globais de produção (GPN)** que reduzem as restrições da geografia física sobre a interação social e econômica. Dois detalhes são cobrados: a palavra **qualitativa** (globalização não é "mais" comércio, é mudança na *natureza* das relações — velocidade, intensidade, integração funcional) e o par **globalização × internacionalização**, que distingue o grau de integração funcional:
- **Internacionalização** — expansão geográfica extensiva das atividades através das fronteiras, com **baixo** grau de integração funcional. Exemplo: exportar para vários países sem coordenar operações (a MNE clássica até os anos 1960).
- **Globalização** — expansão extensiva **+ alto grau de integração funcional**. Exemplo: fábricas na Europa projetando o mesmo elevador padronizado para o mercado inteiro (OTIS fase 2).

**As três interpretações em disputa:**
- **Hiperglobalistas** — o mundo perdeu as fronteiras, o nível nacional deixou de ser relevante ("fim da geografia"). Duas vertentes chegam à mesma conclusão por razões opostas: a de direita (neoliberal) diz que a globalização maximiza as forças de mercado e que precisamos de mais dela; a de esquerda diz que os mercados geram desigualdade e que a falta de regulação beneficia uma minoria. O que une as duas: a globalização é real, profunda e irreversível.
- **Internacionalistas céticos** — a economia mundial se move em ciclos; no período 1880–1914 ("Age of Empires") a economia estava mais aberta e integrada do que hoje. Não é globalizada, é internacional: trocas entre nações autônomas, não uma economia mundial integrada.
- **Regionalistas** — a integração é real, mas concentrada em blocos geográficos, não espalhada uniformemente pelo planeta ("processos regionalizantes").

**O caso histórico 1880–1914 — a "Age of Empires" e as três diferenças:** Dicken confronta a tese cética de frente: sim, 1880–1914 foi um período impressionantemente integrado — navios a vapor cumpriam o papel do container de hoje, o primeiro cabo telegráfico transatlântico (1866) criou uma rede sofisticada, o cinema levava a mesma diversão ao mundo todo, e um surto de migração levou italianos a Nova York e elites alemãs a Londres. A organização produtiva mundial girava em torno dos **impérios coloniais** (Reino Unido, França, Portugal): colônias forneciam matérias-primas, a metrópole processava, e os produtos eram vendidos pelo império.

Então por que hoje é diferente? Três diferenças (caem em prova):
1. **Simultaneidade** — a comunicação de hoje é em tempo real; a telegrafia não era simultânea (rádio transatlântico só nos anos 1920; cabo telefônico só em 1956). É a simultaneidade que permite coordenar redes de produção em tempo real.
2. **Imperialismo** — antes, as redes se organizavam em torno de impérios; hoje, em torno de regiões e cadeias que as próprias empresas escolhem.
3. **Outsourcing global** — as corporações de hoje buscam o trabalho mais barato do mundo inteiro, sem depender de laços coloniais nem confiar só na migração: "levam o trabalho até a fonte da mão de obra".

**Os três processos globalizantes (Dicken)** — organizam *onde* a globalização acontece:
- **Localizante** — atividades geograficamente localizadas, com integração funcional. Ex: clusterização de uma indústria num território.
- **Internacionalizante** — expansão internacional das atividades econômicas. Ex: ETNs abrindo operações em vários países.
- **Regionalizante** — processo internacionalizante concentrado geograficamente. Ex: integrações econômicas como Mercosul, UE, ASEAN.`
    ),
    novoTopico(
      "gni-parte2-ferramentas-dicken",
      "Parte 2 — As ferramentas de análise de Dicken: macroestrutura, redes e circuitos, distribuição desigual",
      `Se a Parte 1 define o fenômeno, esta parte dá os óculos para enxergá-lo. Os **três níveis de análise** de Dicken são o esqueleto da disciplina — toda questão do semestre pede a articulação entre eles.

**Nível 1 — Macroestrutura (a governança):** as instituições, convenções e padrões que formam a moldura institucional do sistema econômico mundial — acordos internacionais, organizações, regimes. Seu papel é a **governança**: define as regras do jogo, influencia fluxos e decisões que impactam as redes globais de produção. Exemplo clássico: o GATT (1947) e a OMC (1995) regulam o comércio internacional e contribuem para a expansão das redes globais de produção. Quando a macroestrutura trava (como na paralisia atual da OMC — órgão de solução de controvérsias travado há anos, com EUA e Índia como veto players), o circuito fica sem gramática comum.

**Nível 2 — Redes e circuitos (os fluxos reais):** as interações reais em sistemas de produção mundiais — quem produz o quê, onde, para quem, e por quais caminhos bens, serviços, capital e conhecimento circulam. Os circuitos conectam empresas, governos e mercados em cadeias de valor interdependentes, cada região com um papel específico.

      `Os semicondutores funcionam como o sistema nervoso digital do planeta, enquanto o sistema financeiro organiza a circulação líquida do capital mundial. Os dois setores são elos altamente complexos, voláteis e vitais para a soberania econômica e a estabilidade das redes de produção — e nos dois casos, quando o sistema ameaça colapsar, é o Estado quem é chamado para intervir.

**A arquitetura dos chips: IDM contra Fabless-Foundry.** O setor de semicondutores é impulsionado pela Lei de Moore — a capacidade dos chips dobra a cada dois anos —, o que gera ciclos constantes do que Schumpeter chamou de destruição criativa: quem não acompanha o ritmo tecnológico é varrido do mercado. A indústria se organiza em três modelos que raramente se sobrepõem: o modelo **IDM** (Intel, Samsung), integrado, que projeta, desenvolve e fabrica os chips internamente; o modelo **Fabless** (Apple, Nvidia, AMD), de empresas que detêm as patentes e desenham os circuitos, mas não possuem fábricas físicas; e as **Foundries** (a taiwanesa TSMC à frente), fundições puras especializadas na manufatura física de altíssima precisão. O monopólio de Taiwan nos chips abaixo de 3 nanômetros é, sozinho, uma das maiores vulnerabilidades geopolíticas do mundo atual — qualquer disrupção nessa ilha paralisaria a produção global de eletrônicos.

**Por que o Estado intervém nos dois setores.** No caso dos semicondutores, a escassez severa de memórias e a dependência excessiva da produção asiática levaram os EUA e a União Europeia a aprovar o **CHIPS Act** — centenas de bilhões de dólares em subsídios diretos para forçar o *onshoring*, o retorno das fábricas de chips (as *fabs*) ao território nacional, tratando a tecnologia como questão de segurança nacional. No caso das finanças, a crise do subprime de 2008 consagrou o conceito de *Too Big to Fail* ("grandes demais para falir"): a quebra em cadeia de poucos bancos gigantes ameaçou arrastar toda a economia mundial para a insolvência, exigindo resgates estatais bilionários e uma reestruturação da governança financeira internacional mediada pelo FMI — o mesmo dilema que atravessa toda a disciplina: como equilibrar inovação e eficiência de mercado com estabilidade e proteção social.`

**As três formas de organização de mercado.** O Estado molda a geografia automotiva por meio de três estratégias estruturais. A primeira são as regras de conteúdo local, que exigem por lei que uma parcela substancial das peças do veículo seja fabricada no território nacional, forçando a ETN a desenvolver fornecedores locais em vez de simplesmente importar o carro pronto. A segunda é o protecionismo defensivo, com barreiras tarifárias pesadas que blindam a indústria doméstica e forçam as montadoras estrangeiras a construir fábricas físicas no país — o fenômeno das maquiladoras no México é o exemplo clássico. A terceira são as *joint ventures* forçadas, um modelo amplamente usado pelo Estado chinês para absorver tecnologia ocidental em troca de acesso ao seu mercado.

    novoFlashcard("fc-gni-34", "Qual é a percepção divergente sobre a parceria Brasil–China?", "Para o Brasil, a parceria abrange ampla gama de temas, incluindo alta tecnologia; para a China, trata-se sobretudo de acesso a matérias-primas.", "gni-parte5-caso-china"),
    novoFlashcard("fc-gni-35", "Em que ano a China ultrapassou os EUA como principal parceiro comercial do Brasil?", "Em 2009 — com o comércio bilateral crescendo cerca de 20 vezes em cerca de uma década.", "gni-parte5-caso-china"),
    novoFlashcard("fc-gni-36", "Qual a diferença entre cooperação (Balassa) e integração?", "Cooperação harmoniza políticas econômicas e diminui a discriminação entre países; integração obriga a supressão efetiva das discriminações, incluindo o movimento de fatores produtivos.", "gni-parte6-integracao-blocos"),
    novoFlashcard("fc-gni-37", "O que diferencia uma união aduaneira de uma zona de livre-comércio?", "A união aduaneira soma à zona de livre-comércio uma Tarifa Externa Comum (TEC) para terceiros países.", "gni-parte6-integracao-blocos"),
    novoFlashcard("fc-gni-38", "O que caracteriza um mercado comum, além da união aduaneira?", "A livre circulação de fatores de produção — capital e trabalho (pessoas podem circular, investir, residir e exercer profissão).", "gni-parte6-integracao-blocos"),
    novoFlashcard("fc-gni-39", "Por que o Mercosul é descrito como \"união aduaneira imperfeita\"?", "Por três falhas: incorporação incompleta das normas (especialmente pelo Brasil, com listas de exceção à TEC), ausência de coordenação monetária/fiscal e ausência de recursos para a integração física.", "gni-parte6-integracao-blocos"),
    novoFlashcard("fc-gni-40", "Qual é a advertência de François Perroux sobre integração via mercado?", "Quanto mais desigualmente desenvolvidos os \"espaços nacionais\" participantes, mais a integração via mercado tenderá a aumentar as desigualdades e concentrar os frutos do processo.", "gni-parte6-integracao-blocos"),
    novoFlashcard("fc-gni-41", "O que é o Aquífero Guarani no contexto da integração sul-americana?", "Um reservatório de ~1,2 milhão de km² entre Brasil, Uruguai, Argentina e Paraguai, símbolo da coordenação energética e de infraestrutura regional.", "gni-parte6-integracao-blocos"),
    novoFlashcard("fc-gni-42", "O que é o \"Atrito do Espaço\" na camada de logística?", "A ideia de que todo movimento de mercadorias custa tempo e dinheiro — e que toda a história da logística é a história de reduzir esse atrito.", "gni-parte6b-logistica"),
    novoFlashcard("fc-gni-43", "Qual foi o impacto da containerização (Malcolm McLean) nos custos portuários?", "Reduziu em mais de 90% os custos portuários, permitindo a troca entre navio, trem e caminhão sem abrir a carga.", "gni-parte6b-logistica"),
    novoFlashcard("fc-gni-44", "Por que o Estado é descrito como \"obstáculo e facilitador\" ao mesmo tempo na logística?", "Porque impõe tarifas, vistorias e burocracia (obstáculo), mas também constrói portos de águas profundas e aeroportos de carga (facilitador).", "gni-parte6b-logistica"),
    novoFlashcard("fc-gni-45", "Qual é a lição da logística para a time-space convergence de Dicken?", "Que ela não é abstrata — tem custo real em contêiner, e o Estado decide se esse custo sobe (tarifa) ou desce (porto).", "gni-parte6b-logistica"),
    novoFlashcard("fc-gni-46", "Na entrevista de Herlander Zola (Stellantis), qual é a principal demanda das montadoras estabelecidas frente à entrada chinesa?", "Não vantagem, mas regras iguais para todos — que garantam que as montadoras que investem e produzem localmente continuem competitivas.", "gni-parte7-atualidades"),
    novoFlashcard("fc-gni-47", "Por que a capacidade produtiva chinesa força a exportação agressiva de veículos?", "Porque a capacidade instalada chinesa (~50 milhões de carros/ano) supera de longe seu mercado interno (~28 milhões), obrigando as montadoras a exportar o excedente.", "gni-parte7-atualidades"),
    novoFlashcard("fc-gni-48", "O que o editorial \"Ruim com a ONU, pior sem ela\" defende?", "Que organismos multilaterais podem ser disfuncionais, mas abandoná-los em favor de clubes seletivos não fortalece a paz — apenas amplia os riscos, na lógica da macroestrutura de Dicken.", "gni-parte7-atualidades"),
    novoFlashcard("fc-gni-49", "O que o caso Fuyao (American Factory) ilustra sobre a relocalização industrial?", "Uma ETN chinesa reabrindo, em Ohio, uma planta que a GM havia fechado — com choque de culturas organizacionais e tensões entre a empresa e o Estado americano (sindicato, salários, segurança).", "gni-parte7-atualidades"),
    novoFlashcard("fc-gni-52", "Quais são as três vantagens que uma empresa precisa articular ao mesmo tempo, segundo o paradigma OLI de Dunning, para investir diretamente no exterior?", "Ownership (posse de um ativo exclusivo), Location (atrativos do país de destino) e Internalization (preferência por manter o controle direto em vez de licenciar).", "gni-parte4-estado-etns"),
    novoFlashcard("fc-gni-53", "Quais são as três fases do Ciclo de Vida do Produto, de Vernon?", "Inovação (no país central), exportação e padronização/offshoring (para países periféricos de baixo custo).", "gni-parte4-estado-etns"),
    novoFlashcard("fc-gni-54", "Por que Dicken diz que a ETN não é \"apátrida\", mesmo no estágio de offshoring do Ciclo de Vida do Produto?", "Porque as decisões estratégicas, as patentes e o capital financeiro principal continuam ancorados na sede nacional da empresa, mesmo quando a produção migra para o exterior.", "gni-parte4-estado-etns"),
    novoFlashcard("fc-gni-55", "O que o cardápio do McDonald's (McAloo Tikki na Índia, Pão de Queijo no Brasil) exemplifica?", "A glocalização — a combinação de padronização global do serviço com adaptação de produto às particularidades locais.", "gni-parte4-estado-etns"),
    novoFlashcard("fc-gni-56", "O que o caso Foxconn no Wisconsin (EUA) ilustra sobre a relação Estado-ETN?", "Que o capital móvel pode tornar até um Estado poderoso \"refém\" da negociação — o Estado ofereceu US$ 3 bilhões em incentivos, e a empresa reduziu drasticamente os empregos prometidos.", "gni-parte4-estado-etns"),
    novoFlashcard("fc-gni-57", "Quais são os três modelos de organização da indústria de semicondutores?", "IDM (integrado, como Intel e Samsung), Fabless (detém patentes e design, mas não fabrica, como Apple e Nvidia) e Foundries (fundições puras, como a TSMC).", "gni-parte7b-semicondutores-financas"),
    novoFlashcard("fc-gni-58", "Por que o monopólio da TSMC (Taiwan) nos chips abaixo de 3 nanômetros é considerado uma vulnerabilidade geopolítica extrema?", "Porque qualquer disrupção em Taiwan paralisaria a produção global de eletrônicos, dado que a maior parte da fabricação de chips avançados está concentrada ali.", "gni-parte7b-semicondutores-financas"),
    novoFlashcard("fc-gni-59", "Quais são os três pilares do sistema financeiro global, segundo o material?", "Instituições bancárias e de crédito; mercado de capitais e investimentos; e meios de pagamento e órgãos de regulação.", "gni-parte7b-semicondutores-financas"),
    novoFlashcard("fc-gni-60", "O que motivou o CHIPS Act nos EUA e na União Europeia?", "A escassez severa de memórias e a dependência excessiva da produção de semicondutores concentrada na Ásia, levando a subsídios bilionários para forçar o onshoring das fábricas.", "gni-parte7b-semicondutores-financas"),
    novoFlashcard("fc-gni-61", "O que é o conceito de \"Too Big to Fail\", consagrado na crise de 2008?", "A ideia de que a quebra de poucos bancos gigantes pode arrastar toda a economia mundial para a insolvência, exigindo resgates estatais bilionários.", "gni-parte7b-semicondutores-financas"),
    novoFlashcard("fc-gni-62", "Quais são as três etapas do modelo reversivo de produção da Shein?", "Inteligência artificial preditiva (monitoramento de redes sociais), produção em micro-lotes flexíveis de 100 a 200 unidades, e logística direta hub-to-consumer sem centros de distribuição.", "gni-parte7c-vestuario-shein"),
    novoFlashcard("fc-gni-63", "O que a tragédia do Rana Plaza (2013) expôs sobre a indústria do vestuário?", "O lado sombrio da corrida para o fundo (race to the bottom) — mais de 1.100 trabalhadores, majoritariamente mulheres jovens migrantes, morreram, pressionando as corporações a adotar códigos de conduta mais rigorosos.", "gni-parte7c-vestuario-shein"),
    novoFlashcard("fc-gni-64", "Como a GM e a Ford divergem na forma de organizar suas operações internacionais?", "A GM adotou federação descentralizada, comprando marcas locais (Opel, Holden) com autonomia de design; a Ford tentou centralizar com o conceito de \"carro mundial\" (Mondeo), padronizado globalmente.", "gni-parte7d-automotivo-estado"),
    novoFlashcard("fc-gni-65", "Quais são as três estratégias estatais que moldam a geografia da indústria automotiva?", "Regras de conteúdo local, protecionismo defensivo com barreiras tarifárias (como as maquiladoras mexicanas) e joint ventures forçadas (modelo chinês).", "gni-parte7d-automotivo-estado"),
    novoFlashcard("fc-gni-66", "Por que a transição para veículos elétricos deu à China uma vantagem competitiva avassaladora?", "Porque a China controla a mineração e o refino de terras raras, além da manufatura em larga escala de insumos de lítio — o coração do lucro migrou da mecânica para baterias e software, área em que a China já domina a cadeia.", "gni-parte7d-automotivo-estado"),
    novoFlashcard("fc-gni-50", "No setor de vestuário, o que caracteriza uma \"buyer-driven chain\"?", "Design, marca e marketing capturam a maior parte do valor — a produção/costura é o elo mais fraco da cadeia, geralmente terceirizado a baixo custo.", "gni-parte7c-vestuario-shein"),
    novoFlashcard("fc-gni-51", "Por que o setor automotivo é descrito como \"regionalizado\", e não global?", "Porque cerca de 75% do comércio automotivo mundial é intra-blocos (Europa, América do Norte, Ásia), não distribuído uniformemente pelo planeta.", "gni-parte7d-automotivo-estado"),
  ];

  m.exercicios = [
    novoExercicio("ex-gni-1", "multipla", "Segundo Dicken, o que caracteriza especificamente a globalização em oposição à internacionalização?", ["A expansão geográfica das atividades econômicas", "Um alto grau de integração funcional além da expansão geográfica", "A existência de fronteiras nacionais", "A ausência de comércio internacional"], 1, "Internacionalização é só expansão geográfica extensiva; globalização soma a isso um alto grau de integração funcional entre as operações.", "gni-parte1-globalizacao"),
    novoExercicio("ex-gni-2", "vf", "Para os internacionalistas céticos, a globalização é um fenômeno inédito e sem precedentes na história econômica mundial.", [], 1, "Falso. Os céticos argumentam justamente o contrário: que o período 1880–1914 já foi tão ou mais integrado do que hoje, e que a economia mundial se move em ciclos.", "gni-parte1-globalizacao"),
    novoExercicio("ex-gni-3", "multipla", "Qual das alternativas abaixo NÃO é uma das três diferenças apontadas por Dicken entre a globalização atual e a \"Age of Empires\" (1880-1914)?", ["Simultaneidade", "Imperialismo", "Outsourcing global", "Democratização"], 3, "As três diferenças apontadas por Dicken são simultaneidade, imperialismo (redes organizadas por empresas em vez de impérios) e outsourcing global.", "gni-parte1-globalizacao"),
    novoExercicio("ex-gni-4", "multipla", "Um processo globalizante \"localizante\", segundo Dicken, é exemplificado por:", ["A abertura de operações de uma ETN em vários países", "A clusterização de uma indústria em um território específico", "A criação do Mercosul", "A assinatura de um tratado de livre-comércio"], 1, "O processo localizante refere-se a atividades geograficamente concentradas com integração funcional, como a aglomeração (clusterização) de uma indústria.", "gni-parte1-globalizacao"),
    novoExercicio("ex-gni-5", "multipla", "No exemplo da cadeia global de valor da Nutella, o conceito de \"lead firm\" se refere a:", ["O país que fornece a maior parte das matérias-primas", "A empresa que coordena a rede, mesmo sem produzir diretamente os insumos", "O consumidor final do produto", "A organização internacional que regula o comércio de alimentos"], 1, "A lead firm (no caso, a Ferrero) é quem coordena a rede global de produção, mesmo distribuindo a produção dos insumos entre vários países.", "gni-parte2-ferramentas-dicken"),
    novoExercicio("ex-gni-6", "vf", "No nível 3 de análise de Dicken, uma alternativa de prova que descreva a distribuição de ativos de poder como \"equilibrada entre os países\" tende a estar correta.", [], 1, "Falso. O padrão descrito por Dicken é justamente a assimetria e a concentração de valor — alternativas que falam em distribuição equilibrada costumam ser a armadilha da prova.", "gni-parte2-ferramentas-dicken"),
    novoExercicio("ex-gni-7", "multipla", "O caso da CBA (Companhia Brasileira de Alumínio) exemplifica principalmente:", ["Um exemplo de investimento de carteira sem controle operacional", "Uma cadeia com integração vertical completa e controle de custos ao longo dos elos", "A ausência de macroestruturas influenciando o circuito produtivo", "Um exemplo de cooperação (e não integração) entre Estados"], 1, "A CBA integra verticalmente toda a cadeia, da mineração de bauxita até a fase industrial final, controlando custos e compartilhando know-how entre os elos.", "gni-parte2-ferramentas-dicken"),
    novoExercicio("ex-gni-8", "multipla", "No \"nexo de relacionamento\" de Dicken, o comércio intra-firma e as alianças estratégicas são exemplos do par:", ["Estado–Estado", "Estado–Empresa", "Empresa–Empresa", "Empresa–Consumidor"], 2, "Comércio intra-firma e alianças estratégicas são mecanismos característicos das relações Empresa–Empresa.", "gni-parte2-ferramentas-dicken"),
    novoExercicio("ex-gni-9", "multipla", "Segundo Lasserre, a diferença central entre empresa multinacional (MNE) e empresa global é:", ["A nacionalidade da matriz", "O grau de autonomia versus coordenação integrada das operações por país", "O tamanho do faturamento anual", "A quantidade de países onde atua"], 1, "MNE tem operações relativamente autônomas por país; empresa global tem atividades fortemente coordenadas e integradas além das fronteiras.", "gni-parte3-lasserre-etns"),
    novoExercicio("ex-gni-10", "multipla", "No caso OTIS, a Fase 2 (a partir do Tratado de Roma) é caracterizada por:", ["Cada país operando de forma totalmente autônoma", "Uma rede de fábricas especializadas na Europa, com produto padronizado para todo o mercado", "O fim das operações europeias da empresa", "A ausência total de coordenação entre subsidiárias"], 1, "A Fase 2 é marcada pela redução de barreiras alfandegárias, permitindo produzir em um país e vender para todos, com um produto padronizado e economias de escala.", "gni-parte3-lasserre-etns"),
    novoExercicio("ex-gni-11", "vf", "Segundo Lasserre, globalizar é sempre um fim em si mesmo, com uma receita única aplicável a qualquer empresa.", [], 1, "Falso. Lasserre é explícito: globalizar não é um fim em si mesmo, é um processo estratégico complexo de trocas e escolhas, sem receita única.", "gni-parte3-lasserre-etns"),
    novoExercicio("ex-gni-12", "multipla", "O benefício de \"arbitragem\" na globalização, segundo Lasserre, consiste em:", ["Padronizar produtos para reduzir custos de design", "Explorar diferenças entre países (custos de trabalho, regimes fiscais) alocando cada atividade no local mais eficiente", "Lançar produtos simultaneamente em todos os mercados", "Transferir conhecimento entre subsidiárias"], 1, "Arbitragem é explorar as diferenças entre países — custos de trabalho, níveis tecnológicos, regimes fiscais — alocando cada atividade da cadeia no local mais eficiente.", "gni-parte3-lasserre-etns"),
    novoExercicio("ex-gni-13", "multipla", "Segundo o modelo de Dunning (1998), uma empresa que abre uma fábrica de componentes no México voltada para exportação está buscando principalmente:", ["Mercado (market-seeking)", "Eficiência (efficiency-seeking)", "Recursos (resource-seeking)", "Ativos estratégicos (strategic asset-seeking)"], 1, "A busca por eficiência refere-se à redução de custos produtivos, como mão de obra e logística — exatamente o caso de uma fábrica voltada à exportação.", "gni-parte4-estado-etns"),
    novoExercicio("ex-gni-14", "vf", "IED (FDI) e investimento de carteira (portfolio) são sinônimos, pois ambos envolvem investimento estrangeiro em uma empresa.", [], 1, "Falso. FDI envolve controle sobre a operação da empresa investida; o investimento de carteira é puramente financeiro, sem controle.", "gni-parte4-estado-etns"),
    novoExercicio("ex-gni-15", "multipla", "Qual das alternativas NÃO é uma das cinco funções do Estado listadas para explicar por que ele \"continua importando\" na economia globalizada?", ["Moldar a macroestrutura internacional", "Regular fluxos além das fronteiras", "Eliminar toda regulação para maximizar o livre mercado", "Disputar a localização da produção com incentivos e barreiras"], 2, "O Estado continua central justamente pela sua capacidade regulatória — eliminar toda regulação contraria a tese de que \"o Estado realmente importa\".", "gni-parte4-estado-etns"),
    novoExercicio("ex-gni-16", "multipla", "Os \"seis pilares da civilização chinesa\" apresentados na aula com o Embaixador Fausto Godoy incluem todos os itens abaixo, EXCETO:", ["Confucionismo", "Mandato do Céu", "Guanxi", "Liberalismo econômico"], 3, "Os seis pilares são história/culto dos ancestrais, Confucionismo, Mandato do Céu, obsessão pela unidade territorial, Mianzi e Guanxi — o liberalismo econômico não está entre eles.", "gni-parte5-caso-china"),
    novoExercicio("ex-gni-17", "multipla", "As Zonas Econômicas Especiais (ZEEs) criadas por Deng Xiaoping tiveram como principal função:", ["Isolar a China do comércio internacional", "Receber IED com regras diferenciadas, servindo de laboratório para a abertura econômica", "Reduzir a produção industrial chinesa", "Substituir o papel do Partido Comunista na economia"], 1, "As ZEEs (como Shenzhen e Zhuhai) receberam IED com regras diferenciadas, infraestrutura e incentivos, funcionando como laboratório da abertura econômica chinesa.", "gni-parte5-caso-china"),
    novoExercicio("ex-gni-18", "vf", "Segundo o material da disciplina, Brasil e China percebem a parceria bilateral da mesma forma, com foco equivalente em tecnologia e matérias-primas.", [], 1, "Falso. Há uma percepção divergente: o Brasil vê a parceria de forma ampla, incluindo alta tecnologia; a China a vê sobretudo como acesso a matérias-primas.", "gni-parte5-caso-china"),
    novoExercicio("ex-gni-19", "multipla", "O que diferencia uma união aduaneira de uma simples zona de livre-comércio?", ["A união aduaneira elimina apenas tarifas internas", "A união aduaneira acrescenta uma Tarifa Externa Comum (TEC) para terceiros países", "A união aduaneira permite livre circulação de capital e trabalho", "A união aduaneira é sinônimo de mercado comum"], 1, "A união aduaneira soma à zona de livre-comércio uma Tarifa Externa Comum para terceiros países — dizer que ela se limita à eliminação de tarifas internas é a armadilha clássica.", "gni-parte6-integracao-blocos"),
    novoExercicio("ex-gni-20", "multipla", "O Mercosul é descrito no material como uma \"união aduaneira imperfeita\" por três razões principais. Qual das alternativas NÃO é uma dessas razões?", ["Incorporação incompleta das normas ao ordenamento jurídico dos membros", "Ausência de coordenação monetária e fiscal", "Ausência de recursos para integração física (estradas, ferrovias, hidrovias)", "Falta de qualquer Tarifa Externa Comum"], 3, "O Mercosul já possui Tarifa Externa Comum (é o que o classifica como união aduaneira); as três falhas apontadas são incorporação incompleta das normas, ausência de coordenação monetária/fiscal e ausência de recursos para integração física.", "gni-parte6-integracao-blocos"),
    novoExercicio("ex-gni-21", "vf", "Segundo a advertência de François Perroux, a integração via mercado tende a reduzir as desigualdades entre espaços nacionais desigualmente desenvolvidos.", [], 1, "Falso. Perroux alerta o contrário: quanto mais desiguais os espaços nacionais participantes, mais a integração via mercado tende a aumentar as desigualdades e concentrar os frutos do processo.", "gni-parte6-integracao-blocos"),
    novoExercicio("ex-gni-22", "multipla", "A containerização, associada a Malcolm McLean, teve como principal efeito:", ["Aumentar os custos portuários para financiar novos portos", "Reduzir em mais de 90% os custos portuários, permitindo transferência entre modais sem abrir a carga", "Eliminar a necessidade de portos de águas profundas", "Restringir o comércio marítimo a poucos países"], 1, "A containerização e a intermodalidade reduziram drasticamente (mais de 90%) os custos portuários, permitindo transferências entre navio, trem e caminhão sem abrir a carga.", "gni-parte6b-logistica"),
    novoExercicio("ex-gni-23", "vf", "Na camada de logística, o Estado atua exclusivamente como obstáculo ao comércio internacional, nunca como facilitador.", [], 1, "Falso. O Estado tem dupla face: é obstáculo (tarifas, vistorias, burocracia) e também facilitador (portos de águas profundas, aeroportos de carga, acordos regionais).", "gni-parte6b-logistica"),
    novoExercicio("ex-gni-24", "multipla", "Segundo a entrevista de Herlander Zola (Stellantis) ao Estadão, a principal demanda das montadoras estabelecidas no Brasil frente à concorrência chinesa é:", ["Barreiras totais à importação de qualquer veículo estrangeiro", "Regras iguais para todos os competidores, que preservem quem investe e produz localmente", "Subsídios exclusivos para a Stellantis", "O fim de qualquer regulação automotiva"], 1, "A demanda das montadoras não é por vantagem, mas por uma regra igual para todos os competidores, que garanta espaço para quem investe e produz localmente.", "gni-parte7-atualidades"),
    novoExercicio("ex-gni-25", "multipla", "Por que a capacidade produtiva instalada da indústria automotiva chinesa força a exportação agressiva de veículos?", ["Porque o mercado interno chinês é maior que a capacidade instalada", "Porque a capacidade instalada (~50 milhões de carros/ano) supera muito o mercado interno (~28 milhões)", "Porque a China não tem interesse em vender no mercado doméstico", "Porque os veículos chineses não atendem a normas técnicas internas"], 1, "A capacidade instalada chinesa é muito superior ao seu mercado interno, o que obriga as montadoras a exportar o excedente de produção.", "gni-parte7-atualidades"),
    novoExercicio("ex-gni-26", "vf", "O editorial \"Ruim com a ONU, pior sem ela\" defende que abandonar organismos multilaterais em favor de clubes seletivos fortalece a paz internacional.", [], 1, "Falso. O editorial argumenta o contrário: abandonar organismos multilaterais não corrige suas falhas, apenas amplia os riscos ao eliminar a gramática comum entre rivais.", "gni-parte7-atualidades"),

**O nome "América" e sua apropriação.** Um dos conceitos centrais da disciplina: o nome vem de Amerigo Vespucci (viagens entre 1497 e 1504); em 1507, Martin Waldseemüller publicou o mapa que batizou as terras de *America* — inicialmente designando apenas a América do Sul, termo consolidado no século XVI. Em muitos idiomas do mundo, "América" designa o continente inteiro (visão distinta da que prevalece nos EUA). A apropriação veio em etapas: com a independência das 13 colônias em 1776, o termo *United States of America* fez "americano" virar sinônimo de cidadão dos EUA; o século XIX reforça com a Doutrina Monroe (1823) e o Destino Manifesto; e o século XX-XXI fecha com o *soft power* (Hollywood, mídia) universalizando essa identificação exclusiva — uma construção histórica contestada na América Latina.

**EUA × Canadá: duas origens, dois destinos.** As trajetórias divergem desde a origem colonial (13 colônias britânicas × colonização francesa da Nova França, cedida à Grã-Bretanha na Guerra dos Sete Anos de 1763) até o marco de Estado (independência de 1776 × Confederação de 1867). A trajetória dos EUA foi de expansão agressiva (Destino Manifesto, Guerra Mexicano-Americana); a do Canadá, defensiva (Guerra de 1812 contra os EUA, Confederação como estratégia para evitar anexação). Um detalhe central: a Confederação canadense de 1867 foi em grande parte uma defesa contra os Estados Unidos — unir as colônias para não serem absorvidas. O Canadá só teve política externa independente a partir de 1931 (Estatuto de Westminster).

      `A aula constrói a teoria geral que amarra os blocos do continente. **Integração regional** ocorre quando Estados soberanos criam instituições e regras compartilhadas para aprofundar interdependência econômica, política e jurídica. O referencial clássico é o **modelo escalonado de Béla Balassa** (1961): a integração avança por etapas progressivas e interdependentes, em que cada nível pressupõe o anterior — zona de preferências tarifárias → área de livre comércio → união aduaneira → mercado comum → união econômica → integração política plena.

Os fatores que empurram a integração são de três tipos: **econômicos** (comércio intrarregional, cadeias produtivas), **políticos** (cooperação, governança compartilhada, estabilidade democrática) e **geopolíticos** (autonomia estratégica, inserção no sistema internacional) — com a CEPAL como fonte teórica própria da região: o pensamento estruturalista que via a integração como via de desenvolvimento para escapar da posição periférica.

**USMCA** (2020) — sucessor do NAFTA, com menor ambição supranacional e foco regulatório: setor automotivo (regras de origem rígidas que integram EUA-México-Canadá), agricultura e energia, tecnologia e comércio digital, propriedade intelectual. A assimetria de poder é o traço dominante: EUA dominantes, México e Canadá dependentes. A revisão formal do USMCA está prevista para o fim de 2026 — tratada por institutos de pesquisa internacionais como a fonte central de incerteza comercial da próxima década, com cenários que vão da renovação com ajustes mínimos até o enfraquecimento via protecionismo e fragmentação das cadeias.

function montarHistoriaRI1() {
  const m = novaMateria("2-historia-ri-1", "História das Relações Internacionais I");

  m.resumo = "Do fim da Idade Média ao nascimento do Estado moderno soberano: por que a Europa não era o centro do mundo em 1500 nem em 1600, como a divisão política e religiosa da Europa gerou a Guerra dos Trinta Anos (1618–1648), como a Paz de Westfália criou o conceito de soberania territorial, e como o princípio do equilíbrio de poder (criado por Richelieu) rege todas as guerras europeias entre 1660 e 1815, até ser quebrado por Napoleão.";

  m.topicos = [
    novoTopico(
          "fim-idade-media-estado-moderno",
          "Aula 1 — Fim da Idade Média e Origem do Estado Moderno Europeu (13/08)",
          "A aula inteira responde a uma única pergunta: **por que o modelo de Estado que usamos no mundo inteiro até hoje nasceu na Europa?** O caminho tem 4 degraus (cada um, um slide): Mundo em 1500 → Mundo em 1600 → Uma Europa dividida → Impacto da Reforma → Paz de Westfália (1648), origem do conceito de soberania.\n\n**Marco temporal do curso**: a disciplina vai de **1648 (Paz de Westfália) até 1914 (Primeira Guerra Mundial)**. Tudo o que essa primeira aula cobre (1500–1600) é o pano de fundo que explica como se chegou a 1648.\n\n**O que é o Estado moderno?** Tem duas metades: por dentro, a **concentração do poder governamental**; por fora (nas Relações Internacionais), a **soberania** — o reconhecimento de que, dentro daquele território, somente um governante tem o poder de criar e impor leis. Poder, em RI, não é ciência política: é **influência sobre os outros atores**.\n\n**Por que a RI é eurocêntrica e anglo-saxã?** Eurocêntrica porque a Europa colonizou o mundo e impôs esse modelo de Estado soberano ao restante das civilizações. Anglo-saxã porque foram Reino Unido e Estados Unidos que desenvolveram os conceitos e teorias para explicar essa realidade política internacional.\n\n**Mundo em 1500** — a Europa não era o centro do mundo, longe disso: só tinha \"salsichinhas de festa infantil\" (as caravelas) navegando para cá. O centro estava na Ásia. Datas-chave do slide: Cabral chega ao Brasil (1500); Maquiavel publica *O Príncipe* (1513) — \"a política como ela é\"; otomanos derrotam os mamelucos e controlam Egito e Levante (1516); Lutero divulga as 95 Teses (1517) — estopim da Reforma; Cortés conquista Tenochtitlan (1521) e Pizarro inicia a conquista do Império Inca (1532); Suécia se independiza da União de Kalmar (1523); Ato da Supremacia — Henrique VIII rompe com Roma (1534); Calvino publica as *Institutas da Religião Cristã* (1536); **início da União Ibérica (1580)**; Armada Invencível de Filipe II derrotada pela Inglaterra (1588).\n\n**A União Ibérica (1580–1640), explicada por completo**: Portugal ficou sem sucessor e o rei da Espanha assumiu — mas a administração continuou em Lisboa, nunca passou para Madri. Por isso a fronteira do Tratado de Tordesilhas \"se desfaz\" na prática: os portugueses avançaram para oeste porque, oficialmente sendo um só país com a Espanha, não tinha mais por que ficar limitados. **O Brasil é grande por pura diplomacia portuguesa**, não por acaso. A União termina em 1640 (morte do rei espanhol; revolta portuguesa pela independência).\n\n**Mundo em 1600 — a Europa ainda não era central.** Os europeus já controlavam mais território que 150 anos antes, mas só nas Américas e um pouco da África — tecnológica, econômica e militarmente ainda eram muito atrasados em relação aos povos asiáticos. Prova final: **quem desenvolveu a pólvora foram os chineses, não os europeus.** Enquanto isso: Dinastia Ming (China) era a maior economia do planeta, mas começa a entrar em recessão por problemas internos; Império Mughal (Índia, islâmico) no auge de expansão territorial; Otomanos batem no teto no Mediterrâneo com a derrota na **Batalha de Lepanto (1571)** — a primeira vez que europeus derrotam os otomanos no mar; Rússia sai do \"período de problemas\" (1584–1613) e começa a se expandir; Portugal já tem o **primeiro império global** (Brasil, África, Ásia, Japão).\n\n**Uma Europa dividida**: quem mandava na Europa? **Ninguém.** O Sacro Império Romano-Germânico tinha papel importante, mas não era subordinado ao Papa nem controlava os próprios súditos — \"nem santo, nem romano, nem império\": cerca de 300 unidades políticas, cada uma com autonomia. O Papa também perdia influência gradualmente. Os Habsburgos, o poder mais forte da época, estavam divididos em dois ramos — o **espanhol** (controlando União Ibérica, Nápoles, Sicília, Milão, Países Baixos espanhóis) e o **austríaco** (Áustria, Boêmia, Hungria, disputando o controle do Sacro Império). No meio de tudo isso, a **França cercada**: terras espanholas ao sul (Espanha), a leste (Milão) e ao norte (Flandres/Artois). Esse cerco explica praticamente todas as guerras das aulas seguintes.\n\n**Tese \"darwinista\" da divisão europeia**: alguns pesquisadores defendem que essa Europa pequena mas extremamente dividida gerou uma luta por sobrevivência entre governos — só os mais aptos sobreviveram — e foi esse laboratório de concorrência interna que forjou o Estado moderno.\n\n**Impacto da Reforma — o ponto mais importante não é religião, é política.** Antes de 1520, toda a Europa era católica romana. A tradução da Bíblia para o alemão por Lutero (1522) permitiu, pela primeira vez, uma leitura direta entre a pessoa e Deus, sem passar pela mediação da Igreja Católica — e essa mediação perdida é **poder político perdido**. Sequência: Lutero professa os três sermões (1516–1517) → 95 Teses em Wittenberg (outubro de 1517) → Bíblia em alemão (1522) → Gustavo I da Suécia rompe com a Igreja (1525) → Ato da Supremacia inglês (1534, pelo **Parlamento**, diferente do rompimento por decisão real da Suécia) → Cristiano III da Dinamarca rompe com a Igreja (1536) → protestantismo domina as Províncias Unidas e Flandres, gerando a **Guerra dos 80 Anos / Revolta Holandesa** (década de 1560) → Concílio de Trento (1545–1563), a Contrarreforma.\n\n**A amarração final da aula**: Europa politicamente dividida + Europa religiosamente dividida → conflito religioso → **Guerra dos Trinta Anos** → **Paz de Westfália (1648)** → origem do conceito de soberania territorial.\n\n**O momento mais importante da aula (pegadinha clássica de prova): a palavra \"soberania\" não aparece nos tratados de Münster e Osnabrück.** O que está escrito é apenas que \"o rei (líder) tem o direito de impor sua religião em seu território\". Foram os estudiosos de Relações Internacionais do século XX que deram a esse princípio o nome de soberania — é um **conceito**, não uma palavra da época."

    novoTopico(
          "guerra-trinta-anos",
          "A Guerra dos Trinta Anos (1618–1648)",
          "A palavra-chave da aula inteira: **LEGITIMIDADE** — quem tem o direito de mandar num território. A Europa do início do século XVII vive uma disputa por legitimidade: o **Sacro Império Romano-Germânico** era descentralizado, com cerca de 300 unidades políticas e complexidade jurídica (quem efetivamente tem o poder de mandar, criar e impor leis?). Era \"Sacro\" por legitimação da Igreja, \"Romano\" por se apresentar herdeiro de Roma, \"Germânico\" por seu núcleo estar na Europa central.\n\n**Os grandes atores**: o **Império Habsburgo Austríaco** (Áustria, Hungria, Boêmia, partes da Croácia/Eslovênia/Eslováquia) — multiétnico, busca centralizar o poder e impor o catolicismo, gerando conflito com protestantes; Fernando (Ferdinando) II, católico absolutista, torna-se Imperador em 1619. O **Império Habsburgo Espanhol** — o \"primo-irmão mais rico\", controlando Espanha, Portugal, Países Baixos espanhóis, Nápoles, Sicília, Milão e as Américas; rico pelo ouro e prata latino-americanos, mas com crise econômica por inflação e má administração. O principal interesse espanhol na Europa continental eram os **Países Baixos** — porto, comércio, impostos.\n\n**Os demais atores**: os **Países Baixos (Sete Províncias Unidas)** — protestantismo forte, república confederada com poder nas elites mercantis, favorecida ao comércio e difícil de invadir militarmente, criou a Companhia Holandesa das Índias Orientais (1602); a **Dinamarca**, sob Cristian IV, controlava o estreito de Oresund e cobrava taxas de navios, mas com altos gastos militares comprometendo as finanças; a **França**, ainda pouco centralizada, dividida em ducados e províncias, com Luís XIII (1610–1643) e o primeiro-ministro **Richelieu** tentando unificá-la; a **Suécia**, sob Gustavo II Adolfo (1611–1632), no auge do poder militar, reino luterano com economia baseada em ferro e cobre.\n\n**As causas — legitimidade + território + religião, uma sobreposição só.** Fernando II tentou impor o catolicismo em todos os seus territórios, não respeitando a liberdade religiosa da Boêmia estabelecida na **Carta de Majestade (1609)** pelo Sacro Imperador Rudolf II. A Boêmia estava, ao mesmo tempo, dentro do Império Habsburgo-Austríaco e dentro do Sacro Império Romano-Germânico — uma sobreposição de legitimidade. Não era apenas religioso: quem controla o território controla a economia e os impostos (referência a Charles Tilly — *Coerção e Capital na Formação do Estado Europeu*). O estopim do problema é religião, mas o problema em si não é só religioso.\n\n**O estopim: 23 de maio de 1618, a Defenestração de Praga.** Dois enviados de Ferdinando II foram a Praga impor a vontade do rei e foram jogados pela janela — sobreviveram, caindo sobre um monte de feno. A Boêmia depôs Ferdinando e elegeu o calvinista Frederico V como rei — hoje seria considerado uma guerra civil. Os outros reis católicos, liderados pela **Liga Católica** (Bavária, formada em 1609), mandaram tropas apoiar a Áustria — o conflito deixa de ser só da Áustria e ganha contornos regionais.\n\n**As quatro fases da guerra** (não é uma guerra só — mistura religião e poder o tempo todo):\n- **Fase Boêmia/Palatinado (1618–1620)**: vitória católica na Batalha da Montanha Branca (1620); a Boêmia volta ao controle dos Habsburgos; execução da aristocracia boêmia; Frederico V foge para Haia.\n- **Fase Dinamarquesa (1625–1629)**: Cristian IV entra para apoiar os protestantes alemães; a Dinamarca era o reino protestante mais forte, mas não forte o suficiente; assina a Paz de Lübeck (1629) e se retira — auge do poder Habsburgo.\n- **Fase Sueca (1630–1635)**: Gustavo II Adolfo entra como o segundo reino protestante mais forte; vitória na Batalha de Breitenfeld (1631), primeira grande derrota do exército imperial; morte do rei em Lützen (1632).\n- **Fase Francesa (1635–1648)**: a reviravolta — a França, **católica**, entra ao lado dos protestantes. Não é por religião: é para impedir que os Habsburgos austríacos dominem a Europa Central e, um dia, ameacem a própria França. A partir daqui a lógica da guerra é puramente **política de poder**, não mais religiosa.\n\n**As negociações de paz — o bolso apertou.** Vinte anos de guerra pagando mercenários (a principal forma de organização militar da época) endividaram todos os governos — católicos ainda tinham que pagar dízimos à Igreja. As negociações aconteceram em duas cidades diferentes porque ninguém confiava em estar na mesma sala: **Münster** (França × Império Habsburgo austríaco) e **Osnabrück** (Suécia × Império) — por isso os tratados são conhecidos como **Tratados de Münster e Osnabrück**, condensados na expressão \"Paz de Westfália\". Principais obstáculos: religião (liberdade de culto × territórios \"recuperados\"), territórios estratégicos na Europa Central, autonomia dos príncipes alemães, e o **equilíbrio de poder** — França e Suécia queriam conter a Áustria e a Espanha. É a primeira vez que surge essa ideia na Europa: **equilíbrio de poder** (*balance of power* — não é \"balança\", é \"equilíbrio\").\n\n**As decisões da Paz de Westfália (1648)**: reconhecimento oficial de católicos, luteranos e calvinistas no Sacro Império; **cada príncipe passou a ter o direito de escolher a religião do seu território** — o princípio que cria uma soberania ligada a um território que os outros reconhecem como seu; a França recebeu territórios na Alsácia; a Suécia ganhou territórios no norte da \"Alemanha\"; **Holanda e Suíça tiveram sua independência reconhecida**; os quase 300 Estados do Sacro Império ganharam autonomia para fazer alianças, desde que não fossem contra o Imperador — uma soberania limitada, que não resolveu de vez o problema de legitimidade no coração da Europa, mas marcou o fim prático da autoridade central do Império (que perde força, mas não deixa de existir).\n\n**Quem ganhou e quem perdeu**: **França** — a grande vencedora, sai fortalecida e central, com Richelieu desenvolvendo a lógica de que nenhum Estado pode dominar a Europa Central. **Espanha** — declínio relativo e praticamente irreversível, perdeu os Países Baixos, gastou o que não tinha. **Suécia** — sai fortalecida, mas declina como potência ao longo do século XVIII. **Comunidade Polaco-Lituana** — entra em declínio até ser anexada pela Rússia em 1795. **Prússia** — em ascensão, principalmente com Frederico II o Grande (1740–1786), que soube \"jogar o jogo\" do equilíbrio de poder via guerras. **Áustria** — \"arranhada, mas forte\": não perdeu território nem força militar, mas não conseguiu o que queria; com população pequena e dependente do continente, não podia permitir uma nova hegemonia. **Inglaterra** — \"ganha de escanteio\": lucrou com o comércio sem se enfraquecer, torna-se, junto com a Holanda, centro econômico e financeiro, e passa a ter peso fundamental para manter o equilíbrio de poder.\n\n**Conclusões para a prova**: a guerra durou trinta anos porque ninguém foi forte o suficiente para vencer de vez — o exército era feito de mercenários, sem ninguém grande o bastante para impor sua vontade. A mortandade foi a maior da Europa até a Segunda Guerra Mundial (entre 20% e 40% da população da \"Alemanha\" morreu). Foi uma guerra religiosa? Sim, mas não só — foi também política e de poder. A Paz de Westfália não terminou com todas as guerras da Europa: a partir dali, as guerras passam a ser pelo interesse do Estado (razão de Estado), não mais por religião."

    novoTopico(
          "guerras-1660-1815-equilibrio-poder",
          "Guerras entre 1660 e 1815 — o jogo do Equilíbrio de Poder (Exercício 1)",
          "Exercício guiado: identificar, em ordem cronológica, quais guerras do período foram **importantes para a lógica das Relações Internacionais da época** — não por data, mas por **envolvimento de grandes potências** — e responder sempre à mesma pergunta: *isso afeta o equilíbrio de poder da Europa ou não?*\n\n**O elenco fixo (o \"elenco de novela\" — os personagens não mudam, só as alianças)**: **Áustria** (Habsburgo) — potência continental central, o \"equilibrista\" do período, lidera a resistência sempre que alguém cresce demais. **Espanha** — grande potência em declínio relativo (\"todo mundo que a derrota está batendo em cachorro morto\"). **França** (Bourbon a partir de 1700) — a grande potência em crescimento, a \"vilã\" da história, tenta quebrar o equilíbrio o período inteiro. **Inglaterra/Grã-Bretanha** — potência naval fora do continente, quase não lutou na Guerra dos Trinta Anos mas depois se envolve em todas, financiando coalizões. **Holanda** — potência comercial e naval, rica mas pequena, sempre precisando de aliados. **Suécia** — fortíssima até Westfália, depois \"escorrega ladeira abaixo\" gradualmente. **Império Turco-Otomano** — potência não cristã, um dos maiores exércitos da época, o \"vilão externo\" que une os cristãos. **Rússia** — potência emergente, começa como \"última a chegar\" e termina como uma das maiores, crescendo ao devorar territórios do sul (Ucrânia, Mar Negro — o solo mais fértil do mundo, ao lado da Argentina). **Prússia** — potência emergente terrestre, no começo do século XVIII ainda não é grande potência, depois vira rival da Áustria. **Polônia** — não é potência, é o \"prêmio\": o trono dela decide o equilíbrio do Leste Europeu.\n\n**As duas famílias reais que governam tudo**: **Casa de Habsburgo**, com dois braços — o austríaco (o imperador) e o espanhol (as Américas) — eram \"primos\", e por isso a Áustria sustentou a Guerra dos Trinta Anos com a riqueza espanhola. **Casa de Bourbon** — a família real da França. Quando o último Habsburgo espanhol morre sem herdeiro (por volta de 1700), quem sucede é um Bourbon francês — e isso explode a Europa em guerra. **Regra prática**: toda vez que aparece \"Guerra da Sucessão X\", a pergunta é sempre a mesma — se esse trono cair nas mãos erradas, alguém fica forte demais?\n\n**A única lógica que rege o período inteiro** (a frase mais repetida da aula): \"Território gera riquezas, e riquezas geram PODER. Portanto, quem pode tomar território toma, até que os outros se juntem e dêem porrada.\" O **equilíbrio de poder** não era uma regra escrita nem havia um juiz — era uma **ideia criada por Richelieu** e aceita pelos outros por conveniência: ninguém pode dominar a Europa Central, porque quem dominar vira hegemonia. E a frase de Churchill que resume tudo: **\"Países não têm amigos, países têm interesses.\"** — a Áustria era inimiga da França numa guerra e aliada na seguinte, sem contradição nenhuma.\n\n**As guerras que importam, em ordem (critério: envolvimento de grandes potências, não data)**:\n- **Guerra Anglo-Holandesa** (anos 1650–1670) — Inglaterra × Holanda: a primeira guerra pós-Westfália por posse de território e comércio, não por religião.\n- **Guerra Franco-Holandesa** (1672–1678) — França × Províncias Unidas (+ Espanha, Sacro Império): a Espanha \"dá o troco\" — \"se não é meu, também não é teu\".\n- **Grande Guerra Turca** (1683–1699) — Liga Santa (Áustria, Polônia, Veneza, Rússia) × Otomanos: primeira grande derrota otomana; mostra que o equilíbrio de poder deixa de ser um \"clube cristão\" — os reis olham os otomanos pela lógica de poder, não de religião.\n- **Guerra dos Nove Anos** (1688–1697) — França × Grande Aliança: a contradição central do período — a própria França, criadora da ideia de equilíbrio de poder, é quem tenta quebrá-la primeiro. \"Lei do mais forte\": sem regra, sem juiz, quem pode, cresce.\n- **Guerra da Sucessão Espanhola** (1701–1714) — França+Espanha (Bourbon) × Grande Aliança liderada pela Áustria (+ Inglaterra, Holanda, Portugal): o trono espanhol vai para um Bourbon — França e Espanha juntas seriam poder demais numa aliança só. Termina com um acordo que **veta a união das duas coroas**.\n- **Guerra da Quádrupla Aliança** (1718–1720) — França, Grã-Bretanha, Áustria e Holanda × Espanha: a Espanha em declínio tenta se reaver como grande potência e todos se juntam para impedir — potência em declínio não pode se recuperar em paz.\n- **Guerra da Sucessão Polonesa** (1733–1738) — França, Espanha e Sardenha × Áustria, Rússia e Saxônia: o trono polonês vazio ameaça alterar o equilíbrio no Leste Europeu.\n- **Guerra Russo-Turca** (1735–1739) — Rússia e Áustria × Otomanos: o nascimento da Rússia como grande potência, ao tomar territórios estratégicos do Império Otomano.\n- **Guerra da Sucessão Austríaca** (1740–1748) — Prússia, França, Espanha × Áustria, Grã-Bretanha, Holanda: disputa pelo trono Habsburgo após a ascensão de Maria Teresa.\n- **Guerra dos Sete Anos** (1756–1763) — Grã-Bretanha e Prússia × França, Áustria, Rússia, Espanha e Suécia: \"quase a Primeira Guerra Mundial\" — a maior da lista, disputa global entre uma potência terrestre emergente (Prússia) e um poder naval (Inglaterra).\n- **Guerra da Baviera** (1778–1779) — Áustria × Prússia: pequena, mas marca o início da rivalidade germânica entre as duas potências que vai até a unificação alemã no século XIX.\n- **Guerras da Revolução Francesa** (1792–1802) — Coalizões 1ª e 2ª × França revolucionária: a França vira ameaça por dois motivos — as ideias (revolução liberal, ameaça existencial aos absolutismos vizinhos) e a força (Exército Nacional de 400 000–600 000 homens, contra mercenários de 50 000–60 000 do período anterior).\n- **Guerras Napoleônicas** (1803–1815) — França de Napoleão × Coalizões 3ª a 7ª: **o equilíbrio de poder é quebrado.** O mesmo Estado que criou a ideia do equilíbrio, em 1648, é quem finalmente o derruba — exército gigantesco, economia forte e um gênio militar. \"Por que eu não vou fazer, se eu posso?\"\n\n**A fórmula que vale para qualquer guerra dessa lista**: alguém cresce ou um trono fica vazio → os demais sentem o desequilíbrio → formam coalizão → guerra → o equilíbrio se reequilibra → até o próximo que cresce.\n\n**Três esclarecimentos finais que valem para a prova**: (1) o equilíbrio de poder não era regra, era **ideia** — criada por Richelieu, aceita por conveniência; (2) o **Estado nasce na França** desse período — Richelieu é praticamente o fundador do Estado francês, uma instituição que passa a ter interesses próprios, independentes da monarquia; (3) **tudo era baseado em percepção** (\"eu acho que sou forte\") — sem satélites nem inteligência moderna, só se descobria a força real de um Estado quando os outros se juntavam e davam \"porrada\"."

    novoFlashcard("fc-hri-21", "O que aconteceu quando o último Habsburgo espanhol morreu sem herdeiro, por volta de 1700?", "O trono espanhol passou a um Bourbon francês, o que ameaçava unir França e Espanha numa única e poderosíssima aliança — o que gerou a Guerra da Sucessão Espanhola (1701–1714).", "guerras-1660-1815-equilibrio-poder"),

  m.anotacoes = "O curso vai de 1648 (Westfália) a 1914 (Primeira Guerra) e carrega duas marcas: é eurocêntrico, pois o modelo de Estado soberano nasceu na Europa e foi imposto ao mundo, e é anglo-saxão, já que Reino Unido e EUA desenvolveram boa parte da teoria de RI.\n\nAté 1600, a Europa ainda não era o centro do mundo — a China Ming tinha a maior economia do planeta, e até a pólvora era invenção chinesa. A ascensão europeia veio depois, com a União Ibérica (1580–1640) explicando o tamanho do Brasil, e a Batalha de Lepanto (1571) marcando a primeira derrota naval otomana.\n\nA Reforma teve peso mais político que religioso: ao traduzir a Bíblia, Lutero rompeu a mediação da Igreja — e, com ela, seu poder político. O Ato de Supremacia inglês (1534) repete essa lógica, mas por via legal, diferente da decisão real que rompeu a Suécia com Roma.\n\nA Guerra dos Trinta Anos nasceu de uma sobreposição de legitimidades na Boêmia, disputada entre o Império Habsburgo-Austríaco e o Sacro Império — no fundo, uma disputa por quem cobra impostos. Estourou com a Defenestração de Praga (1618) e passou por quatro fases até a França entrar, já não por religião, mas por medo de uma Áustria fortalecida demais. A paz saiu cara e desconfiada (negociada em duas cidades, Münster e Osnabrück) e deixou dois legados centrais: a soberania territorial (a palavra \"soberania\" nem aparece nos tratados — foi batizada só no século XX) e o equilíbrio de poder, ideia de Richelieu contra qualquer hegemonia na Europa Central.\n\nEsse equilíbrio organiza todas as guerras de 1660 a 1815: território gera riqueza, riqueza gera poder, e quem cresce demais é contido por uma coalizão — \"países não têm amigos, têm interesses\" (Churchill). Foi assim na Grande Guerra Turca, nas guerras de sucessão (Espanhola, Polonesa, Austríaca) e na ascensão russa via Ucrânia e Mar Negro. O ciclo só quebra com Napoleão, que rompe o próprio equilíbrio que a França ajudara a criar.";

      novaMateria("7-topicos-avancados-1", "Sem. de Tópicos Avançados I"),
