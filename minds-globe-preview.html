      novaMateria("7-internacionalizacao-empresas", "Internacionalização de Empresas")
    ]
  },
  {
    numero: 8,
    ordinal: "8º",
    subjects: [
      novaMateria("8-pgi-3", "Projeto de Graduação Internacional (PGI) – III"),
      novaMateria("8-topicos-avancados-3", "Sem. de Tópicos Avançados III"),
      novaMateria("8-topicos-avancados-4", "Sem. de Tópicos Avançados IV"),
      novaMateria("8-tendencias-cenarios", "Tendências e Cenários Prospectivos nas RIs")
    ]
  }
];

</script>
<script>
/* =========================================================================
   MINDS GLOBE — APP.JS
   Roteamento por hash (sem dependências), renderização das views,
   menu mobile, revelação ao rolar, microinterações, flashcards,
   exercícios e estatísticas de desempenho (tudo salvo no localStorage —
   sem servidor, sem banco de dados).
   ========================================================================= */

(function () {
  "use strict";

  const app = document.getElementById("app");
  const yearEl = document.getElementById("year");
  if (yearEl) yearEl.textContent = new Date().getFullYear();

  /* ---------------------------------------------------------------- */
  /* Progresso — "continuar de onde parei"                            */
  /* ---------------------------------------------------------------- */

  const PROGRESS_KEY = "minds-globe:last-visited";

  function saveProgress(route) {
    try {
      if (route.name === "semester") {
        const sem = findSemester(route.numero);
        if (!sem) return;
        localStorage.setItem(
          PROGRESS_KEY,
          JSON.stringify({ type: "semester", numero: sem.numero, label: `${sem.ordinal} semestre` })
        );
      } else if (route.name === "subject") {
        const found = findSubject(route.id);
        if (!found) return;
        localStorage.setItem(
          PROGRESS_KEY,
          JSON.stringify({
            type: "subject",
            id: found.subject.id,
            label: found.subject.nome,
            semesterLabel: `${found.semester.ordinal} semestre`
          })
        );
      }
    } catch (e) {
      /* localStorage indisponível — sem problema, só não salva */
    }
  }

  function loadProgress() {
    try {
      const raw = localStorage.getItem(PROGRESS_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) {
      return null;
    }
  }

  /* ---------------------------------------------------------------- */
  /* Estatísticas de desempenho (acertos/erros por tópico)            */
  /* Guardadas no localStorage, no formato:                           */
  /* { "<subjectId>": { "<topicoId ou _geral>": {acertos, tentativas} } } */
  /* ---------------------------------------------------------------- */

  const STATS_KEY = "minds-globe:stats:v1";

  function loadStats() {
    try {
      const raw = localStorage.getItem(STATS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }

  function saveStats(stats) {
    try {
      localStorage.setItem(STATS_KEY, JSON.stringify(stats));
    } catch (e) {
      /* sem problema, só não persiste */
    }
  }

  function recordAttempt(subjectId, topicoId, correct, weight) {
    weight = weight || 1;
    const stats = loadStats();
    const key = topicoId || "_geral";
    if (!stats[subjectId]) stats[subjectId] = {};
    if (!stats[subjectId][key]) stats[subjectId][key] = { acertos: 0, tentativas: 0 };
    stats[subjectId][key].tentativas += weight;
    if (correct) stats[subjectId][key].acertos += weight;
    saveStats(stats);
  }

  function resetStats() {
    try {
      localStorage.removeItem(STATS_KEY);
    } catch (e) {
      /* sem problema */
    }
  }

  function resetSubjectStats(subjectId) {
    const stats = loadStats();
    delete stats[subjectId];
    saveStats(stats);
  }

  function getSubjectPerformance(subject) {
    const stats = loadStats();
    const subjectStats = stats[subject.id] || {};
    const rows = [];
    (subject.topicos || []).forEach((t) => {
      const s = subjectStats[t.id];
      if (s && s.tentativas > 0) {
        rows.push({
          id: t.id,
          titulo: t.titulo,
          acertos: s.acertos,
          tentativas: s.tentativas,
          pct: Math.round((s.acertos / s.tentativas) * 100)
        });
      }
    });
    const geral = subjectStats["_geral"];
    if (geral && geral.tentativas > 0) {
      rows.push({
        id: "_geral",
        titulo: "Geral (sem tópico vinculado)",
        acertos: geral.acertos,
        tentativas: geral.tentativas,
        pct: Math.round((geral.acertos / geral.tentativas) * 100)
      });
    }
    rows.sort((a, b) => a.pct - b.pct);
    return rows;
  }

  function getGlobalWeakTopics(limit) {
    const stats = loadStats();
    const rows = [];
    semestersData.forEach((sem) => {
      sem.subjects.forEach((subj) => {
        const subjectStats = stats[subj.id];
        if (!subjectStats) return;
        (subj.topicos || []).forEach((t) => {
          const s = subjectStats[t.id];
          if (s && s.tentativas > 0) {
            rows.push({
              subjectId: subj.id,
              subjectNome: subj.nome,
              semestre: sem.ordinal,
              titulo: t.titulo,
              acertos: s.acertos,
              tentativas: s.tentativas,
              pct: Math.round((s.acertos / s.tentativas) * 100)
            });
          }
        });
        const geral = subjectStats["_geral"];
        if (geral && geral.tentativas > 0) {
          rows.push({
            subjectId: subj.id,
            subjectNome: subj.nome,
            semestre: sem.ordinal,
            titulo: "Conteúdo geral da matéria",
            acertos: geral.acertos,
            tentativas: geral.tentativas,
            pct: Math.round((geral.acertos / geral.tentativas) * 100)
          });
        }
      });
    });
    rows.sort((a, b) => a.pct - b.pct);
    return limit ? rows.slice(0, limit) : rows;
  }

  /* ---------------------------------------------------------------- */
  /* Estado de interação (por matéria — some quando muda de página)   */
  /* ---------------------------------------------------------------- */

  let openTopics = { subjectId: null, ids: new Set() };
  let flashState = { subjectId: null, index: 0, completed: false, deck: [] };
  let examState = { subjectId: null, phase: "start", order: [], currentIndex: 0, answers: {}, results: null };

  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function ensureOpenTopicsScope(subjectId) {
    if (openTopics.subjectId !== subjectId) openTopics = { subjectId: subjectId, ids: new Set() };
  }
  function ensureFlashScope(subjectId) {
    if (flashState.subjectId !== subjectId) {
      const found = findSubject(subjectId);
      const cards = found ? found.subject.flashcards || [] : [];
      flashState = { subjectId: subjectId, index: 0, completed: false, deck: shuffleArray(cards) };
    }
  }
  function ensureExamScope(subjectId) {
    if (examState.subjectId !== subjectId) {
      examState = { subjectId: subjectId, phase: "start", order: [], currentIndex: 0, answers: {}, results: null };
    }
  }
  function startExam(subjectId) {
    const found = findSubject(subjectId);
    const qs = found ? found.subject.exercicios || [] : [];
    examState = { subjectId: subjectId, phase: "active", order: shuffleArray(qs), currentIndex: 0, answers: {}, results: null };
  }

  /* ---------------------------------------------------------------- */
  /* Helpers                                                           */
  /* ---------------------------------------------------------------- */

  function findSemester(numero) {
    return semestersData.find((s) => s.numero === Number(numero));
  }

  function findSubject(id) {
    for (const sem of semestersData) {
      const found = sem.subjects.find((m) => m.id === id);
      if (found) return { subject: found, semester: sem };
    }
    return null;
  }

  function totalSubjects() {
    return semestersData.reduce((acc, s) => acc + s.subjects.length, 0);
  }

  function iconArrowLeft() {
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>';
  }

  function iconArrowRight() {
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>';
  }

  function iconCompass() {
    return '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.5l-2 5-5 2 2-5 5-2z"/></svg>';
  }

  function iconChevron() {
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  }

  function iconCheck() {
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline-block;vertical-align:-3px;margin-right:4px;"><path d="M20 6L9 17l-5-5"/></svg>';
  }

  function bookGlyphSVG() {
    return '<svg class="book-glyph" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10.5"/><path d="M16 5.5c3.4 3 3.4 17 0 21"/><path d="M16 5.5c-3.4 3-3.4 17 0 21"/><path d="M5.5 16h21"/></svg>';
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function emptyBlock(msg) {
    return `
      <div class="empty-state">
        ${iconCompass()}
        <p>Ainda não há nada por aqui.</p>
        <small>${msg}</small>
      </div>`;
  }

  /* Executa uma função de renderização com segurança: se algo quebrar,
     mostra uma mensagem clara em vez de deixar a seção em branco/sumida. */
  function safeRender(fn, label) {
    try {
      return fn();
    } catch (e) {
      console.error("Minds Globe — erro ao renderizar \"" + label + "\":", e);
      return `
        <div class="empty-state">
          ${iconCompass()}
          <p>Não foi possível carregar esta seção.</p>
          <small>Aconteceu um erro em "${label}". Abra o console do navegador (F12) para ver os detalhes técnicos.</small>
        </div>`;
    }
  }

  /* Formatação leve de texto: parágrafos, **negrito**, *itálico*,
     "> " para citação e "- " para listas — sem precisar de HTML. */
  function applyInline(escapedText) {
    return escapedText.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>");
  }

  function richText(raw) {
    if (!raw) return "";
    const blocks = raw.split(/\n\s*\n/);
    return blocks
      .map((block) => {
        const lines = block
          .split("\n")
          .map((l) => l.trim())
          .filter(Boolean);
        if (lines.length === 0) return "";
        if (lines.every((l) => l.startsWith("- "))) {
          return "<ul>" + lines.map((l) => `<li>${applyInline(escapeHtml(l.slice(2)))}</li>`).join("") + "</ul>";
        }
        if (lines.every((l) => /^\d+\.\s/.test(l))) {
          return "<ol>" + lines.map((l) => `<li>${applyInline(escapeHtml(l.replace(/^\d+\.\s/, "")))}</li>`).join("") + "</ol>";
        }
        if (lines[0].startsWith("> ")) {
          const text = lines.map((l) => applyInline(escapeHtml(l.replace(/^>\s?/, "")))).join("<br>");
          return `<blockquote>${text}</blockquote>`;
        }
        if (lines.length >= 2 && lines[0].includes("|") && /^\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?$/.test(lines[1])) {
          const splitRow = (l) =>
            l
              .replace(/^\|/, "")
              .replace(/\|$/, "")
              .split("|")
              .map((c) => c.trim());
          const headerCells = splitRow(lines[0]);
          const bodyRows = lines.slice(2).map(splitRow);
          const theadHtml = "<tr>" + headerCells.map((c) => `<th>${applyInline(escapeHtml(c))}</th>`).join("") + "</tr>";
          const tbodyHtml = bodyRows
            .map((row) => "<tr>" + row.map((c) => `<td>${applyInline(escapeHtml(c))}</td>`).join("") + "</tr>")
            .join("");
          return `<div class="rich-table-wrap"><table><thead>${theadHtml}</thead><tbody>${tbodyHtml}</tbody></table></div>`;
        }
        return `<p>${lines.map((l) => applyInline(escapeHtml(l))).join("<br>")}</p>`;
      })
      .join("");
  }

  /* ---------------------------------------------------------------- */
  /* Views                                                             */
  /* ---------------------------------------------------------------- */

  function continueButton() {
    const progress = loadProgress();
    if (!progress) return "";
    const href = progress.type === "subject" ? `#/materia/${progress.id}` : `#/semestre/${progress.numero}`;
    return `<a class="btn-ghost" href="${href}">Continuar: ${escapeHtml(progress.label)}</a>`;
  }

  function homeView() {
    const total = totalSubjects();
    const books = semestersData
      .map(
        (sem) => `
      <a class="book reveal" href="#/semestre/${sem.numero}" aria-label="${sem.ordinal} semestre, ${sem.subjects.length} matérias">
        <div class="book-cover">
          ${bookGlyphSVG()}
          <span class="book-ordinal">${sem.ordinal}</span>
          <span class="book-label">Semestre</span>
          <span class="book-count"><strong>${sem.subjects.length}</strong> matéria${sem.subjects.length === 1 ? "" : "s"}</span>
        </div>
      </a>`
      )
      .join("");

    return `
      <section class="hero" id="home">
        <div class="wrap">
          <div class="hero-copy">
            <span class="eyebrow">Repositório pessoal de estudos</span>
            <h1>Seu mundo de<br><em>Relações Internacionais</em>, organizado.</h1>
            <p>O Minds Globe reúne cada semestre da sua graduação em um só lugar — um atlas particular para guardar resumos, tópicos, flashcards e exercícios conforme você avança pelo curso.</p>
            <div class="hero-actions">
              <a class="btn-primary" href="#semestres">Ver semestres ${iconArrowRight()}</a>
              ${continueButton()}
            </div>
            <div class="hero-stats">
              <div>
                <span class="stat-value">${semestersData.length}</span>
                <span class="stat-label">Semestres</span>
              </div>
              <div>
                <span class="stat-value">${total}</span>
                <span class="stat-label">Matérias mapeadas</span>
              </div>
              <div>
                <span class="stat-value">RI</span>
                <span class="stat-label">Relações Internacionais</span>
              </div>
            </div>
          </div>
          <div class="globe-stage" aria-hidden="true">
            <div class="globe-halo"></div>
            ${globeSVG()}
          </div>
        </div>
      </section>

      <section class="section" id="semestres">
        <div class="wrap">
          <div class="section-head">
            <div>
              <span class="eyebrow">Sua trajetória</span>
              <h2>Os semestres</h2>
            </div>
            <p>Cada capa guarda um semestre inteiro do curso. Escolha um para abrir o sumário de matérias.</p>
          </div>
          <div class="shelf">
            ${books}
          </div>
        </div>
      </section>
    `;
  }

  function semesterView(numero) {
    const sem = findSemester(numero);
    if (!sem) return notFoundView();

    const cards = sem.subjects
      .map(
        (m, i) => `
      <a class="subject-card reveal" href="#/materia/${m.id}">
        <span class="subject-index">${String(i + 1).padStart(2, "0")}</span>
        <h3>${escapeHtml(m.nome)}</h3>
        ${iconArrowRight().replace("<svg", '<svg class="subject-arrow"')}
      </a>`
      )
      .join("");

    return `
      <div class="page-head">
        <div class="wrap">
          <a class="btn-back" href="#/">${iconArrowLeft()} Voltar ao globo</a>
          <span class="eyebrow">${sem.ordinal} semestre</span>
          <h1>Sumário do ${sem.ordinal} semestre</h1>
          <p class="meta">${sem.subjects.length} matéria${sem.subjects.length === 1 ? "" : "s"} cadastrada${sem.subjects.length === 1 ? "" : "s"}</p>
        </div>
      </div>
      <div class="wrap">
        <div class="subject-grid">
          ${cards}
        </div>
      </div>
    `;
  }

  /* --- Acordeão de tópicos ("mundos dentro de mundos") --- */

  function accordionHtml(subject) {
    ensureOpenTopicsScope(subject.id);
    const topicos = subject.topicos || [];
    if (topicos.length === 0) return emptyBlock("Adicione tópicos em js/data.js — cada um vira um mundo à parte, que abre com um clique.");

    return (
      `<div class="accordion">` +
      topicos
        .map((t, i) => {
          const isOpen = openTopics.ids.has(t.id);
          return `
        <div class="accordion-item ${isOpen ? "is-open" : ""}">
          <button class="accordion-trigger" type="button" data-action="toggle-topic" data-topic="${t.id}" aria-expanded="${isOpen}" aria-controls="topic-panel-${t.id}">
            <span class="accordion-index">${String(i + 1).padStart(2, "0")}</span>
            <span class="accordion-title">${escapeHtml(t.titulo)}</span>
            <span class="accordion-chevron">${iconChevron()}</span>
          </button>
          <div class="accordion-panel" id="topic-panel-${t.id}">
            <div class="accordion-panel-inner">
              <div class="rich-text">${richText(t.conteudo) || emptyBlock("Escreva o conteúdo completo deste tópico em js/data.js.")}</div>
            </div>
          </div>
        </div>`;
        })
        .join("") +
      `</div>`
    );
  }

  /* --- Flashcards --- */

  function flashcardWidgetHtml(subject) {
    ensureFlashScope(subject.id);
    const cards = flashState.deck;
    if (cards.length === 0) return emptyBlock("Adicione flashcards em js/data.js para praticar aqui.");
    if (flashState.index >= cards.length) flashState.index = cards.length - 1;
    if (flashState.index < 0) flashState.index = 0;
    const card = cards[flashState.index];

    const completeBanner = flashState.completed
      ? `<div class="deck-complete">
           <p>${iconCheck()} Você passou por todos os ${cards.length} flashcards desta matéria.</p>
           <div class="deck-complete-actions">
             <button type="button" class="btn-ghost btn-sm" data-action="scroll-to-performance">Ver o que revisar</button>
             <button type="button" class="btn-ghost btn-sm" data-action="flash-restart">Recomeçar flashcards</button>
           </div>
         </div>`
      : "";

    return `
      <div class="flashcard-widget">
        <div class="flashcard-meta">Card ${flashState.index + 1} de ${cards.length}</div>
        <button class="flashcard" type="button" data-action="flip-card" aria-label="Virar card para ver a resposta">
          <span class="flashcard-inner">
            <span class="flashcard-face flashcard-front"><span class="rich-text">${richText(card.frente)}</span></span>
            <span class="flashcard-face flashcard-back"><span class="rich-text">${richText(card.verso)}</span></span>
          </span>
        </button>
        <div class="flashcard-controls">
          <button class="btn-ghost btn-sm" type="button" data-action="flash-nav" data-dir="prev" ${flashState.index === 0 ? "disabled" : ""}>${iconArrowLeft()} Anterior</button>
          <div class="flashcard-mark">
            <button class="btn-mark btn-mark-no" type="button" data-action="flash-mark" data-remembered="false" data-topic="${card.topicoId || ""}">Não lembrei</button>
            <button class="btn-mark btn-mark-yes" type="button" data-action="flash-mark" data-remembered="true" data-topic="${card.topicoId || ""}">Lembrei</button>
          </div>
          <button class="btn-ghost btn-sm" type="button" data-action="flash-nav" data-dir="next" ${flashState.index === cards.length - 1 ? "disabled" : ""}>Próximo ${iconArrowRight()}</button>
        </div>
        ${completeBanner}
        <button type="button" class="btn-text-reset" data-action="flash-restart">Recomeçar do primeiro card</button>
      </div>`;
  }

  /* --- Exercícios --- */

  /* --- Prova rápida (formato "provinha") --- */

  function examWidgetHtml(subject) {
    ensureExamScope(subject.id);
    const total = (subject.exercicios || []).length;
    if (total === 0) return emptyBlock("Adicione exercícios em js/data.js para montar a prova aqui.");

    if (examState.phase === "start") return examStartHtml(total);
    if (examState.phase === "active") return examActiveHtml(subject);
    if (examState.phase === "results") return examResultsHtml(subject);
    return "";
  }

  function examStartHtml(total) {
    return `
      <div class="exam-start">
        <p class="exam-start-title">Prova rápida desta matéria</p>
        <p class="exam-start-sub">${total} ${total === 1 ? "questão" : "questões"} embaralhada${total === 1 ? "" : "s"} — você vê o resultado só no final.</p>
        <button type="button" class="btn-primary btn-sm" data-action="exam-start">Começar prova</button>
      </div>`;
  }

  function examActiveHtml(subject) {
    const qs = examState.order;
    const i = examState.currentIndex;
    const q = qs[i];
    const total = qs.length;
    const selected = examState.answers[q.id];
    const options = q.tipo === "vf" ? ["Verdadeiro", "Falso"] : q.opcoes;
    const isLast = i === total - 1;

    const optionsHtml = options
      .map((opt, idx) => {
        const cls = "quiz-option" + (selected === idx ? " is-selected" : "");
        return `<button type="button" class="${cls}" data-action="select-exam-option" data-qid="${q.id}" data-index="${idx}" aria-pressed="${selected === idx}">
        <span class="quiz-option-marker" aria-hidden="true"></span>
        <span>${escapeHtml(opt)}</span>
      </button>`;
      })
      .join("");

    return `
      <div class="exam-progress">Questão ${i + 1} de ${total}</div>
      <div class="exam-progress-bar"><div class="exam-progress-bar-fill" style="width:${((i + (selected !== undefined ? 1 : 0)) / total) * 100}%"></div></div>
      <div class="quiz-question exam-question">
        <p class="quiz-enunciado"><span class="quiz-index">${String(i + 1).padStart(2, "0")}</span>${escapeHtml(q.enunciado)}</p>
        <div class="quiz-options">${optionsHtml}</div>
        <button type="button" class="btn-primary btn-sm" data-action="exam-next" ${selected === undefined ? "disabled" : ""}>${isLast ? "Finalizar prova" : "Próxima questão"}</button>
      </div>`;
  }

  function examResultsHtml(subject) {
    const r = examState.results;
    const pct = Math.round((r.acertos / r.total) * 100);

    const reviewHtml = r.review
      .map((item, idx) => {
        const q = item.question;
        const options = q.tipo === "vf" ? ["Verdadeiro", "Falso"] : q.opcoes;
        const userAnswerText = item.selected === undefined ? "Não respondida" : options[item.selected];
        const correctText = options[q.respostaCorreta];
        return `
        <div class="exam-review-item">
          <p class="quiz-enunciado"><span class="quiz-index">${String(idx + 1).padStart(2, "0")}</span>${escapeHtml(q.enunciado)}</p>
          <p class="exam-review-answer ${item.correct ? "correct" : "wrong"}">
            ${item.correct ? "Certinho — " : "Você respondeu: "}${escapeHtml(userAnswerText)}
          </p>
          ${!item.correct ? `<p class="exam-review-answer correct">Resposta certa: ${escapeHtml(correctText)}</p>` : ""}
          ${q.explicacao ? `<p class="exam-review-explicacao">${escapeHtml(q.explicacao)}</p>` : ""}
        </div>`;
      })
      .join("");

    return `
      <div class="exam-results-score">
        <span class="exam-results-pct">${pct}%</span>
        <p>${r.acertos} de ${r.total} corretas</p>
        <div class="exam-results-actions">
          <button type="button" class="btn-primary btn-sm" data-action="exam-start">Refazer prova</button>
          <button type="button" class="btn-ghost btn-sm" data-action="scroll-to-performance">Ver o que revisar</button>
        </div>
      </div>
      <div class="exam-review">${reviewHtml}</div>`;
  }

  /* --- Painel de desempenho / "conteúdos a estudar" --- */

  function performanceListHtml(rows, global) {
    return (
      `<ul class="performance-list">` +
      rows
        .map((r) => {
          const prioridade = r.pct < 50 ? '<span class="performance-tag">Prioridade</span>' : "";
          const titleHtml = global
            ? `<a href="#/materia/${r.subjectId}">${escapeHtml(r.titulo)}</a>`
            : escapeHtml(r.titulo);
          const subMeta = global ? `<span class="performance-meta">${escapeHtml(r.subjectNome)} · ${r.semestre} semestre · ${r.acertos} de ${r.tentativas} corretas</span>` : `<span class="performance-meta">${r.acertos} de ${r.tentativas} corretas</span>`;
          return `
        <li class="performance-row">
          <div class="performance-row-head">
            <span>${titleHtml} ${prioridade}</span>
            <span class="performance-pct">${r.pct}%</span>
          </div>
          <div class="performance-bar"><div class="performance-bar-fill" style="width:${r.pct}%"></div></div>
          ${subMeta}
        </li>`;
        })
        .join("") +
      `</ul>`
    );
  }

  function performancePanelHtml(subject) {
    const rows = getSubjectPerformance(subject);
    if (rows.length === 0) {
      return emptyBlock("Responda exercícios e avalie flashcards para ver aqui o que mais precisa de revisão.");
    }
    return (
      performanceListHtml(rows, false) +
      `<button type="button" class="btn-text-reset" data-action="reset-subject-stats">Resetar meu progresso nesta matéria</button>`
    );
  }

  function subjectView(id) {

    if (!found) return notFoundView();

    const hasResumo = subject.resumo && subject.resumo.trim().length > 0;

    const hasLeituras = subject.leituras && subject.leituras.length > 0;

    const resumoHtml = hasResumo
      ? `<p>${escapeHtml(subject.resumo).replace(/\n/g, "<br>")}</p>`
      : emptyBlock("Adicione um resumo em js/data.js para vê-lo aqui.");

    const anotacoesHtml = hasAnotacoes
      ? `<p>${escapeHtml(subject.anotacoes).replace(/\n/g, "<br>")}</p>`
      : emptyBlock("Suas anotações soltas aparecerão aqui.");

    const leiturasHtml = hasLeituras
      ? `<ul class="material-list">${subject.leituras
          .map(
            (mat) =>
              `<li>${mat.link ? `<a href="${escapeHtml(mat.link)}" target="_blank" rel="noopener">${escapeHtml(mat.titulo)}</a>` : escapeHtml(mat.titulo)}</li>`
          )
          .join("")}</ul>`
      : emptyBlock("Links e leituras de apoio aparecerão aqui.");

    return `
      <div class="subject-page">
        <div class="subject-header">
          <div class="wrap">
            <a class="btn-back" href="#/semestre/${semester.numero}">${iconArrowLeft()} Voltar ao sumário</a>
            <span class="eyebrow">${semester.ordinal} semestre</span>
            <h1>${escapeHtml(subject.nome)}</h1>
            <p class="subject-breadcrumb"><strong>Minds Globe</strong> / ${semester.ordinal} semestre / ${escapeHtml(subject.nome)}</p>
          </div>
        </div>
        <div class="wrap">
          <div class="content-grid">
            <div class="col-main">
              <div class="content-block reveal">
                <h2>Resumo</h2>
                ${resumoHtml}
              </div>
              <details class="content-block collapsible reveal">
                <summary><h2>Anotações</h2><span class="collapsible-chevron">${iconChevron()}</span></summary>
                <div class="collapsible-body">${anotacoesHtml}</div>
              </details>
            </div>
            <div class="col-side">
              <details class="content-block collapsible reveal">
                <summary><h2>Leituras e material de apoio</h2><span class="collapsible-chevron">${iconChevron()}</span></summary>
                <div class="collapsible-body">${leiturasHtml}</div>
              </details>
              <details class="content-block collapsible reveal" id="conteudos-a-estudar">
                <summary><h2>Conteúdos a estudar</h2><span class="collapsible-chevron">${iconChevron()}</span></summary>
                <div class="collapsible-body">${safeRender(() => performancePanelHtml(subject), "Conteúdos a estudar")}</div>
              </details>
            </div>
          </div>

          <div class="content-block reveal">
            <h2>Tópicos estudados</h2>
            ${safeRender(() => accordionHtml(subject), "Tópicos estudados")}
          </div>

          <div class="content-block reveal">
            <h2>Flashcards</h2>
            ${safeRender(() => flashcardWidgetHtml(subject), "Flashcards")}
          </div>

          <div class="content-block reveal">
            <h2>Exercícios</h2>
            ${safeRender(() => examWidgetHtml(subject), "Exercícios")}
          </div>
        </div>
      </div>
    `;
  }

  function revisaoView() {
    const rows = getGlobalWeakTopics(24);
    const hasData = rows.length > 0;
    const list = hasData
      ? performanceListHtml(rows, true)
      : emptyBlock("Ainda não há dados suficientes. Responda exercícios e avalie flashcards nas matérias para ver aqui o que mais precisa de revisão.");

    return `
      <div class="page-head">
        <div class="wrap">
          <a class="btn-back" href="#/">${iconArrowLeft()} Voltar ao globo</a>
          <span class="eyebrow">Central de revisão</span>
          <h1>Conteúdos a estudar</h1>
          <p class="meta">Ordenado do que você mais errou para o que já domina — considerando exercícios e flashcards de todas as matérias.</p>
        </div>
      </div>
      <div class="wrap">
        <div class="content-block reveal">
          ${list}
        </div>
        ${hasData ? `<button type="button" class="btn-ghost btn-sm" data-action="reset-stats">Apagar meu histórico de respostas</button>` : ""}
      </div>
    `;
  }

  function notFoundView() {
    return `
      <div class="page-head">
        <div class="wrap">
          <a class="btn-back" href="#/">${iconArrowLeft()} Voltar ao globo</a>
          <h1>Página não encontrada</h1>
          <p class="meta">O conteúdo que você procura não existe ou foi movido.</p>
        </div>
      </div>
    `;
  }

  /* ---------------------------------------------------------------- */
  /* Roteador                                                          */
  /* ---------------------------------------------------------------- */

  function parseRoute() {
    const hash = window.location.hash.replace(/^#/, "") || "/";
    const parts = hash.split("/").filter(Boolean);
    if (parts.length === 0) return { name: "home" };
    if (parts[0] === "semestre" && parts[1]) return { name: "semester", numero: parts[1] };
    if (parts[0] === "materia" && parts[1]) return { name: "subject", id: parts[1] };
    if (parts[0] === "revisao") return { name: "revisao" };
    return { name: "home" };
  }

  function titleFor(route) {
    if (route.name === "semester") {
      const sem = findSemester(route.numero);
      return sem ? `${sem.ordinal} Semestre — Minds Globe` : "Minds Globe";
    }
    if (route.name === "subject") {
      const found = findSubject(route.id);
      return found ? `${found.subject.nome} — Minds Globe` : "Minds Globe";
    }
    if (route.name === "revisao") return "Conteúdos a estudar — Minds Globe";
    return "Minds Globe — Atlas de Relações Internacionais";
  }

  function buildViewHtml(route) {
    if (route.name === "home") return homeView();
    if (route.name === "semester") return semesterView(route.numero);
    if (route.name === "subject") return subjectView(route.id);
    if (route.name === "revisao") return revisaoView();
    return notFoundView();
  }

  function render() {
    const rawHash = window.location.hash.replace(/^#/, "");
    const scrollToAnchor = rawHash === "semestres";
    const route = parseRoute();
    closeMobileNav();

    const current = app.querySelector(".view");
    const doSwap = () => {
      app.innerHTML = `<div class="view">${buildViewHtml(route)}</div>`;
      document.title = titleFor(route);
      saveProgress(route);

      if (scrollToAnchor) {
        const target = document.getElementById("semestres");
        if (target) {
          const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          target.scrollIntoView({ behavior: reduceMotion ? "auto" : "smooth", block: "start" });
        }
      } else {
        window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
        const heading = app.querySelector("h1");
        if (heading) {
          heading.setAttribute("tabindex", "-1");
          heading.focus({ preventScroll: true });
        }
      }
      initReveal();
      initTilt();
    };

    if (current && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      current.classList.add("leaving");
      window.setTimeout(doSwap, 160);
    } else {
      doSwap();
    }
  }

  /* Re-renderiza a página atual sem trocar de rota (usado por
     accordions, flashcards e exercícios) — mantém a posição de rolagem. */
  function rerenderCurrent() {
    const route = parseRoute();
    const view = app.querySelector(".view");
    if (!view) return;
    view.innerHTML = buildViewHtml(route);
    initReveal();
  }

  window.addEventListener("hashchange", render);
  window.addEventListener("DOMContentLoaded", render);

  /* ---------------------------------------------------------------- */
  /* Interações delegadas (accordion, flashcards, exercícios)         */
  /* ---------------------------------------------------------------- */

  app.addEventListener("click", function (e) {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const action = target.getAttribute("data-action");
    const route = parseRoute();

    if (action === "toggle-topic") {
      if (route.name !== "subject") return;
      ensureOpenTopicsScope(route.id);
      const topicId = target.getAttribute("data-topic");
      if (openTopics.ids.has(topicId)) openTopics.ids.delete(topicId);
      else openTopics.ids.add(topicId);
      rerenderCurrent();
    } else if (action === "flip-card") {
      target.classList.toggle("is-flipped");
    } else if (action === "flash-nav") {
      if (route.name !== "subject") return;
      ensureFlashScope(route.id);
      const len = flashState.deck.length;
      const dir = target.getAttribute("data-dir");
      flashState.index = dir === "next" ? Math.min(flashState.index + 1, len - 1) : Math.max(flashState.index - 1, 0);
      rerenderCurrent();
    } else if (action === "flash-mark") {
      if (route.name !== "subject") return;
      const remembered = target.getAttribute("data-remembered") === "true";
      const topicoId = target.getAttribute("data-topic") || "";
      recordAttempt(route.id, topicoId, remembered);
      ensureFlashScope(route.id);
      const len = flashState.deck.length;
      if (flashState.index >= len - 1) {
        flashState.completed = true;
      } else {
        flashState.index += 1;
      }
      rerenderCurrent();
    } else if (action === "flash-restart") {
      if (route.name !== "subject") return;
      const found = findSubject(route.id);
      const cards = found ? found.subject.flashcards || [] : [];
      flashState = { subjectId: route.id, index: 0, completed: false, deck: shuffleArray(cards) };
      rerenderCurrent();
    } else if (action === "scroll-to-performance") {
      const el = document.getElementById("conteudos-a-estudar");
      if (el) {
        if (typeof el.open === "boolean") el.open = true;
        el.scrollIntoView({ behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
      }
    } else if (action === "reset-subject-stats") {
      if (route.name !== "subject") return;
      const ok = window.confirm("Isso apaga o histórico de acertos e erros salvo apenas para esta matéria. Quer continuar?");
      if (ok) {
        resetSubjectStats(route.id);
        rerenderCurrent();
      }
    } else if (action === "exam-start") {
      if (route.name !== "subject") return;
      startExam(route.id);
      rerenderCurrent();
    } else if (action === "select-exam-option") {
      if (route.name !== "subject") return;
      ensureExamScope(route.id);
      if (examState.phase !== "active") return;
      const qid = target.getAttribute("data-qid");
      const idx = Number(target.getAttribute("data-index"));
      examState.answers[qid] = idx;
      rerenderCurrent();
    } else if (action === "exam-next") {
      if (route.name !== "subject") return;
      ensureExamScope(route.id);
      if (examState.phase !== "active") return;
      const isLast = examState.currentIndex === examState.order.length - 1;
      if (isLast) {
        const review = examState.order.map((q) => {
          const selected = examState.answers[q.id];
          const correct = selected === q.respostaCorreta;
          recordAttempt(route.id, q.topicoId, correct, 2);
          return { question: q, selected: selected, correct: correct };
        });
        const acertos = review.filter((r) => r.correct).length;
        examState.results = { total: review.length, acertos: acertos, review: review };
        examState.phase = "results";
      } else {
        examState.currentIndex += 1;
      }
      rerenderCurrent();
    } else if (action === "reset-stats") {
      const ok = window.confirm("Isso apaga todo o seu histórico de acertos e erros salvo neste navegador. Quer continuar?");
      if (ok) {
        resetStats();
        rerenderCurrent();
      }
    }
  });

  /* ---------------------------------------------------------------- */
  /* Menu mobile (hamburguer)                                          */
  /* ---------------------------------------------------------------- */

  const hamburger = document.getElementById("hamburger");
  const mobileNav = document.getElementById("mobile-nav");

  function openMobileNav() {
    mobileNav.classList.add("is-open");
    hamburger.setAttribute("aria-expanded", "true");
    document.body.classList.add("menu-open");
  }
  function closeMobileNav() {
    if (!mobileNav) return;
    mobileNav.classList.remove("is-open");
    hamburger.setAttribute("aria-expanded", "false");
    document.body.classList.remove("menu-open");
  }
  if (hamburger) {
    hamburger.addEventListener("click", () => {
      const expanded = hamburger.getAttribute("aria-expanded") === "true";
      expanded ? closeMobileNav() : openMobileNav();
    });
  }
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeMobileNav();
  });
  if (mobileNav) {
    mobileNav.querySelectorAll("a").forEach((a) => a.addEventListener("click", closeMobileNav));
  }

  /* ---------------------------------------------------------------- */
  /* Revelar ao rolar                                                  */
  /* ---------------------------------------------------------------- */

  function initReveal() {
    const items = app.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window) || items.length === 0) {
      items.forEach((el) => el.classList.add("is-visible"));
      return;
    }
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry, i) => {
          if (entry.isIntersecting) {
            const el = entry.target;
            window.setTimeout(() => el.classList.add("is-visible"), i * 40);
            io.unobserve(el);
          }
        });
      },
      { threshold: 0.12, rootMargin: "0px 0px -40px 0px" }
    );
    items.forEach((el) => io.observe(el));
  }

  /* ---------------------------------------------------------------- */
  /* Inclinação 3D dos livros ao passar o mouse                       */
  /* ---------------------------------------------------------------- */

  function initTilt() {
    if (window.matchMedia("(pointer: coarse)").matches) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const covers = app.querySelectorAll(".book-cover");
    covers.forEach((cover) => {
      const parent = cover.closest(".book");
      if (!parent) return;
      parent.addEventListener("mousemove", (e) => {
        const rect = cover.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width - 0.5;
        const y = (e.clientY - rect.top) / rect.height - 0.5;
        cover.style.transform = `rotateY(${x * 14}deg) rotateX(${y * -10}deg) translateY(-6px)`;
      });
      parent.addEventListener("mouseleave", () => {
        cover.style.transform = "";
      });
    });
  }
})();
